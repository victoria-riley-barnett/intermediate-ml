name: book

# Builds book/ with mdBook and publishes it to GitHub Pages.
# Pages must be set to "GitHub Actions" in the repository settings.
on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook 0.5.4
        run: |
          mkdir -p .tools
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz -C .tools
      - name: Build
        run: python3 book/build.py --base=/intermediate-ml/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
