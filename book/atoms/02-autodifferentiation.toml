[[atom]]
id = "ch2.mae"
kind = "term"
term = "mean absolute error"
text = "Mean absolute error is the main alternative: it averages |prediction − truth| instead of the square."
uses = ["ch2.loss"]
see = ["ch2.mse"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
