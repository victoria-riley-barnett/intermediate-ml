# ── Questions ────────────────────────────────────────────────────────────

[[atom]]
id = "ch2.q-what-changes"
kind = "question"
text = "Fitting y = wx + b involves x, y, w and b: which two does training change?"
answer = "w and b, the parameters. x and y are the data and are given."
uses = ["ch2.update-rule"]
[atom.verify]
method = "hand"

[[atom]]
id = "ch2.q-negative-grad"
kind = "question"
text = "w.grad is negative and the step is w − lr × w.grad: does w go up or down?"
answer = "Up. Subtracting a negative number adds, and a negative derivative means the loss falls as w rises."
uses = ["ch2.update-rule"]
[atom.verify]
method = "computed"
says = "2.6 − 0.01 × (−31.284) = 2.91284, which is above 2.6."
expr = "2.6 - 0.01 * -31.284 > 2.6"

[[atom]]
id = "ch2.q-still-falling"
kind = "question"
text = "A loss curve is smooth and still falling when the run ends: what should change?"
answer = "More steps or a larger learning rate. A smooth fall rules out overshoot; the steps are too small to arrive in time."
uses = ["ch2.lr-small"]
[atom.verify]
method = "hand"

[[atom]]
id = "ch2.q-outlier"
kind = "question"
text = "One added outlier pulls a squared-error line and barely moves an absolute-error line: why?"
answer = "Squared error adds the square of the outlier's miss, so it dominates the sum; absolute error counts it at its own size, like any other point."
uses = ["ch2.mean-median", "ch2.big-miss-costs"]
[atom.verify]
method = "hand"
