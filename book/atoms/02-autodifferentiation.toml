heading = "Finding the direction"
sha1 = "35d03ec70fbf"

# ── Finding the direction ────────────────────────────────────────────────

[[atom]]
id = "ch2.derivative"
kind = "term"
term = "derivative"
text = "The derivative says how fast the loss changes as one parameter moves, measured at its current value."
uses = ["ch2.loss"]
see = ["ch2.gradient"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "Finding the direction"
sha1 = "35d03ec70fbf"

[[atom]]
id = "ch2.gradient"
kind = "term"
term = "gradient"
text = "With more than one parameter, the derivatives taken together are the gradient, and PyTorch stores each one in .grad."
uses = ["ch2.derivative"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "Finding the direction"
sha1 = "35d03ec70fbf"

[[atom]]
id = "ch2.sign-orders"
kind = "figure-fact"
text = "Its sign says which way the bottom is: the slope is −31.284 at w = 2.600, 0.000 at w = 3.000 and 31.284 at w = 3.400."
uses = ["ch2.derivative", "ch2.bottom-at-3"]
[atom.verify]
method = "plate"
plate = "eq-mse"

[[atom]]
id = "ch2.slope-sum"
kind = "figure-fact"
text = "At w = 2.600 the errors weighted by their inputs sum to −62.5680, and two over n times that sum is the slope."
uses = ["ch2.sign-orders"]
[atom.verify]
method = "plate"
plate = "eq-mse"

[[atom]]
id = "ch2.slope-check"
kind = "example"
text = "With n = 4 that is −31.284."
uses = ["ch2.slope-sum"]
[atom.verify]
method = "computed"
says = "2 / 4 × (−62.568) = −31.284."
expr = "2 / 4 * -62.568"
number = "-31.284"

# ── One step, and then many ──────────────────────────────────────────────

[[atom]]
id = "ch2.update-rule"
kind = "term"
term = "update rule"
text = "The update rule turns the slope into a move, w ← w − lr × dloss/dw, and the minus sign sends w downhill."
uses = ["ch2.derivative", "ch2.learning-rate"]
[atom.verify]
method = "run"
script = "02-autodifferentiation/one_step.py"
expect = "w after one step: 2.9128"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "One step, and then many"
sha1 = "a6c072c36c6d"

[[atom]]
id = "ch2.one-step"
kind = "figure-fact"
text = "With a step size of 0.010, one update takes w from 2.600 to 2.9128, short of the bottom."
uses = ["ch2.update-rule", "ch2.sign-orders"]
[atom.verify]
method = "plate"
plate = "eq-mse"

[[atom]]
id = "ch2.one-step-check"
kind = "example"
text = "That is 2.6 − 0.01 × (−31.284) = 2.91284."
uses = ["ch2.one-step"]
[atom.verify]
method = "computed"
says = "2.6 − 0.01 × (−31.284) = 2.91284."
expr = "2.6 - 0.01 * -31.284"
number = "2.91284"

[[atom]]
id = "ch2.gradient-descent"
kind = "term"
term = "gradient descent"
text = "Gradient descent is that update applied again and again until the loss stops falling."
uses = ["ch2.update-rule"]
see = ["ch2.converging"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "One step, and then many"
sha1 = "a6c072c36c6d"

[[atom]]
id = "ch2.walk-shrinks"
kind = "figure-fact"
text = "On the simplest loss, L = θ², with step size 0.1, θ goes 2.000, 1.600, 1.280, 1.024, 0.819, each step 0.8 of the last."
uses = ["ch2.gradient-descent"]
[atom.verify]
method = "plate"
plate = "gradient-descent"

[[atom]]
id = "ch2.walk-check"
kind = "example"
text = "Each step multiplies θ by 1 − 2 × 0.1 = 0.8, so four steps from 2 leave 0.8192."
uses = ["ch2.walk-shrinks"]
[atom.verify]
method = "computed"
says = "2 × 0.8⁴ = 0.8192."
expr = "2 * (1 - 2 * 0.1) ** 4"
number = "0.8192"

[[atom]]
id = "ch2.loop-halves"
kind = "figure-fact"
text = "Fitting a single weight to a target of 4 with step size 0.1, the weight goes 0.0000, 2.0000, 3.0000, 3.5000, 3.7500, each gain half the last."
uses = ["ch2.gradient-descent"]
[atom.verify]
method = "plate"
plate = "loop-gradient-descent"

[[atom]]
id = "ch2.loop-run"
kind = "code"
text = "With both w and b free and a learning rate of 0.01, 3,000 steps reach w = 3.000 and b = 7.000."
uses = ["ch2.gradient-descent"]
[atom.verify]
method = "run"
script = "02-autodifferentiation/loop.py"
