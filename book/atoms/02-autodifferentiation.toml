[[atom]]
id = "ch2.weight-gradient"
kind = "figure-fact"
text = "For a single layer, each weight's gradient is the error times that weight's input: with error 3 and inputs 2, 0 and 3, the gradients are 6, 0 and 9."
uses = ["ch2.gradient"]
see = ["03-backpropagation"]
[atom.verify]
method = "plate"
plate = "eq-weight-gradient"

[[atom]]
id = "ch2.zero-input"
kind = "figure-fact"
text = "The weight whose input is 0 gets gradient 0 and stays at 5, even though it is the largest weight."
uses = ["ch2.weight-gradient"]
[atom.verify]
method = "plate"
plate = "eq-weight-gradient"

[[atom]]
id = "ch2.scale"
kind = "claim"
text = "That is why scale matters: with inputs near 200 the weight's gradient is about 200 times the bias's, and no single learning rate suits both."
uses = ["ch2.weight-gradient", "ch2.learning-rate"]
[atom.verify]
method = "hand"
