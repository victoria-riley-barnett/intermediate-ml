# ── The loss ─────────────────────────────────────────────────────────────

[[atom]]
id = "ch2.loss"
kind = "term"
term = "loss"
text = "The loss is one number that scores a model against all of its data at once, and smaller is better."
see = ["ch2.mse", "ch2.mae"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "What the loss measures"
sha1 = "a4d329033821"

[[atom]]
id = "ch2.mse"
kind = "term"
term = "mean squared error"
text = "Mean squared error, the loss used here, averages (prediction − truth)² over all the points."
uses = ["ch2.loss"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "What the loss measures"
sha1 = "a4d329033821"

[[atom]]
id = "ch2.signs-cancel"
kind = "example"
text = "Squaring matters because errors of +2 and −2 would otherwise average to 0, and an unsquared average could call a wrong model perfect."
uses = ["ch2.mse"]
[atom.verify]
method = "computed"
says = "(+2 + (−2)) / 2 = 0."
expr = "(2 + -2) / 2"
number = "0"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "What the loss measures"
sha1 = "a4d329033821"

[[atom]]
id = "ch2.squares-grow"
kind = "example"
text = "It also weighs big misses heavily: errors of −1, +2 and −3 square to 1, 4 and 9, so three times the miss costs nine times as much."
uses = ["ch2.mse"]
see = ["ch2.big-miss"]
[atom.verify]
method = "computed"
says = "(−1)² = 1, 2² = 4, (−3)² = 9, and 9 / 1 = 9."
expr = "[e ** 2 for e in (-1, 2, -3)] == [1, 4, 9] and (-3) ** 2 / (-1) ** 2 == 9"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "What the loss measures"
sha1 = "a4d329033821"

[[atom]]
id = "ch2.big-miss"
kind = "claim"
text = "A squared-error fit will therefore move to shrink one large miss, even if every other point gets slightly worse."
uses = ["ch2.squares-grow"]
see = ["ch2.mean-median"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "What the loss measures"
sha1 = "a4d329033821"

[[atom]]
id = "ch2.mse-worked"
kind = "figure-fact"
text = "On four noise-free points of y = 3x + 7, with b held at its true value 7.000, the loss at w = 2.600 is 6.2568."
uses = ["ch2.mse"]
[atom.verify]
method = "plate"
plate = "eq-mse"

[[atom]]
id = "ch2.mse-run"
kind = "code"
text = "A dozen lines of pure Python reproduce that number, along with the slope at the same point, dL/dw = −31.284."
uses = ["ch2.mse-worked"]
[atom.verify]
method = "run"
script = "02-autodifferentiation/one_step.py"
expect = "loss 6.2568   dL/dw -31.284"

# ── The loss as a function of the weight ─────────────────────────────────

[[atom]]
id = "ch2.point-is-model"
kind = "claim"
text = "Each point on that curve is a whole model: one choice of w, scored against all of the data."
uses = ["ch2.loss"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "The loss as a function of the weight"
sha1 = "54eebbef1bb4"

[[atom]]
id = "ch2.bottom-at-3"
kind = "figure-fact"
text = "The loss is the same 6.2568 at w = 3.400 and falls to 0.0000 at w = 3.000, the weight the points were made from."
uses = ["ch2.mse-worked"]
[atom.verify]
method = "plate"
plate = "eq-mse"

[[atom]]
id = "ch2.scan-cost"
kind = "example"
text = "Scoring every candidate does not scale: 11 values per parameter is 121 models for two parameters and more than a million for six."
[atom.verify]
