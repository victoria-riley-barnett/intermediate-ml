sha1 = "a95a979868f5"

[[atom]]
id = "ch2.mean-median"
kind = "code"
text = "On five readings, 4.0, 4.2, 4.1, 4.3 and 12.0, squared error is smallest at their mean, 5.72, and absolute error at their median, 4.20."
uses = ["ch2.mse", "ch2.mae"]
[atom.verify]
method = "run"
script = "02-autodifferentiation/mean_median.py"
expect = ["squared error is smallest at 5.72   (mean 5.72)", "absolute error is smallest at 4.20   (median 4.20)"]

[[atom]]
id = "ch2.big-miss-costs"
kind = "example"
text = "Squared error says one large miss is worse than many small ones: a miss of 10 costs 100, while ten misses of 1 cost 10."
uses = ["ch2.mse"]
[atom.verify]
method = "computed"
says = "10² = 100; 10 × 1² = 10."
expr = "10 ** 2 == 100 and 10 * 1 ** 2 == 10"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "Which one should you actually use?"
sha1 = "6c69ade5c616"

[[atom]]
id = "ch2.loss-is-a-choice"
kind = "claim"
text = "So choosing a loss is choosing what counts as wrong: an outlier you distrust argues for absolute error, and one you believe argues for squared error."
uses = ["ch2.mean-median"]
see = ["06-multiclass"]
[atom.verify]
method = "hand"
[atom.source]
file = "411/weeks/week02_autodifferentiation/lab.md"
heading = "Which one should you actually use?"
