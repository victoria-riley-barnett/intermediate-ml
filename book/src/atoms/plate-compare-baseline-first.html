<figure data-atom="compare-baseline-first" data-source="admin/diagrams/compare-baseline-first.html" aria-label="One held-out accuracy read against two baselines: 0.3208, 0.9783 and 0.9646 on the same 876 genes" style="margin:0;padding:0;background:#f5f5f5;color:#2d3142;font-family:'Geist',system-ui,sans-serif;border-radius:3px;overflow:hidden">
<svg viewBox="0 0 1280 874" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compare-baseline-first-title compare-baseline-first-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="compare-baseline-first-title">One held-out accuracy read against two baselines: 0.3208, 0.9783 and 0.9646 on the same 876 genes</title>
        <desc id="compare-baseline-first-desc">Three rules on the same 876 held-out genes from a 4,380-row human gene artifact in 7 families. Column A is the null rule, which names the commonest training family (6, transcription factor) for every gene and fits nothing: 281 of 876 genes named right, accuracy 0.3208. Column B is the model the week-06 lab delivers, 9-letter counts into MultinomialNB with alpha = 0.1, fitted on 3,504 training rows: 857 of 876 right, accuracy 0.9783, which is 576 genes more than the null rule. Column C is the same model with one variable moved: each training gene is fitted twice, as itself and as its reverse complement, so the fit sees 7,008 rows but the held-out rows, the 229,996 columns and alpha are unchanged: 845 of 876 right, accuracy 0.9646. Read against A, C is 564 genes ahead; read against B, C is 12 genes behind. Said as errors the same three counts are 595, 19 and 31 genes of 876 named wrong. The 229,996 columns are learned from the training rows only. The family counts are uneven, so the null rule scores 0.3208 rather than one seventh. The key states the data, the marks, the source, the symbols and the scikit-learn calls; the difference of 12 genes is not tested for repeatability and no split other than this one is drawn.</desc>

        <text x="1160" y="52" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end" letter-spacing="0.14em">ACCURACY = GENES NAMED RIGHT &#247; 876</text>

        <text x="120" y="178" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">595 of 876 genes named wrong</text>

        <text x="480" y="178" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">19 of 876 genes named wrong</text>
        <text x="480" y="204" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">a fit on 9-letter counts:</text>

        <text x="840" y="76" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" font-weight="500" letter-spacing="0.14em">C &#183; THE ONE CHANGE, AGAINST BOTH</text>
        <text x="1160" y="124" font-size="40" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="end" font-weight="500">0.9646</text>

        <text x="840" y="178" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">31 of 876 genes named wrong</text>

        <line x1="120" y1="382" x2="1160" y2="382" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>

        <text x="400" y="438" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">+12 genes named wrong of 876 &#183; the change is one variable: the 3,504 fitted genes, each entered twice</text>
        <text x="120" y="466" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">which number counts as an improvement depends on which column is called the baseline; a project that names none has not made a claim</text>
        <line x1="120" y1="514" x2="1160" y2="514" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>

        <text x="208" y="538" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">n = 4,380 human gene sequences, 7 families &#183; 876 held out (20%) by a permutation seeded 42 &#183; 3,504 training rows</text>
        <text x="208" y="554" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">9-letter counts, 229,996 columns learned on the training rows &#183; MultinomialNB alpha = 0.1</text>
