<figure data-atom="eq-layernorm" data-source="admin/diagrams/eq-layernorm.html" aria-label="Layer normalisation" style="margin:0;padding:0;background:#f5f5f5;color:#2d3142;font-family:'Geist',system-ui,sans-serif;border-radius:3px;overflow:hidden">
<svg viewBox="0 0 1280 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eq-layernorm-title eq-layernorm-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="eq-layernorm-title">Layer normalisation</title>
        <desc id="eq-layernorm-desc">Layer normalisation of one row of d = 32 features, and the two learned vectors it owns. The equation is: the i-th output equals gamma_i times (x_i minus mu) over sigma, plus beta_i. mu and sigma are one number each, the mean and population standard deviation of this one row's 32 features; gamma and beta are one number each per feature and are parameters. The width d = 32 is the width the delivered week-12 encoder block uses: it builds Block(32, 2), feeds it a (4, LENGTH, 32) tensor and constructs nn.LayerNorm(width). The row drawn is constructed rather than sampled, and its values were chosen so the printed arithmetic is exact: x_i = −1.5, 2.0, −1.0, 3.5, 0.0, 1.0, 2.0, 1.0, −0.5, 4.0, 5.5, 5.5, 5.0, −1.5, 5.0, −2.0, 5.5, 2.5, 4.5, −1.0, 4.0, −2.5, 2.5, 0.5, 0.0, 3.0, 5.5, 1.5, 5.0, −0.5, 3.5, 2.0. Their sum is 64.0, so mu = 64.0/32 = 2.0; the squared deviations sum to 200.0, so sigma = the square root of 200.0/32 = 6.25 = 2.5. The middle row is (x_i minus mu) over sigma: −1.4, 0.0, −1.2, 0.6, −0.8, −0.4, 0.0, −0.4, −1.0, 0.8, 1.4, 1.4, 1.2, −1.4, 1.2, −1.6, 1.4, 0.2, 1.0, −1.2, 0.8, −1.8, 0.2, −0.6, −0.8, 0.4, 1.4, −0.2, 1.2, −1.0, 0.6, 0.0. Its sum over the 32 cells is 0.0 and its sum of squares is 32.0, so its mean is 0.0 and its standard deviation is 1.0 — the standardisation is a property recomputed from the printed cells, not a claim. The learned vectors are gamma = 1.5, 2.0, 0.5, 1.5, 0.5, 2.5, 1.5, 1.0, 1.5, 1.5, 0.5, 2.5, 1.5, 1.5, 2.5, 2.5, 1.5, 1.5, 2.0, 0.5, 2.5, 2.0, 1.5, 0.5, 1.0, 1.0, 1.5, 2.0, 2.5, 1.5, 1.0, 2.5 and beta = −0.5, −0.5, 1.5, 0.5, −0.5, −0.5, 1.0, 2.0, 1.5, 2.0, 0.0, −0.5, 0.0, 0.0, −0.5, 0.5, 0.5, 1.0, 0.5, 0.0, 0.0, 2.0, 2.0, 2.0, 1.0, 0.5, 0.5, 1.5, 0.0, 2.0, 1.0, 0.5, constructed and not the identity: 2d = 64 parameters. The last row is gamma_i times the middle row plus beta_i, elementwise: −2.6, −0.5, 0.9, 1.4, −0.9, −1.5, 1.0, 1.6, 0.0, 3.2, 0.7, 3.0, 1.8, −2.1, 2.5, −3.5, 2.6, 1.3, 2.5, −0.6, 2.0, −1.6, 2.3, 1.7, 0.2, 0.9, 2.6, 1.1, 3.0, 0.5, 1.6, 0.5. Its mean is 0.8 and its standard deviation is 1.7, so the printed statistics of the output are the parameters' and not 0 and 1. At i = 12: x_i = 5.5, so (x_i minus mu) over sigma = (5.5 minus 2.0) over 2.5 = 1.4, and the output is 2.5 times 1.4, plus −0.5, is 3.0. mu and sigma are taken over the 32 features of this row; no other row enters any number on the page.</desc>
