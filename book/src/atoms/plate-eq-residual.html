        <title id="eq-residual-title">The residual connection's derivative</title>
        <desc id="eq-residual-desc">The derivative through a residual connection. The block's output is x₂ = x + F(x); differentiating with respect to the input gives dx₂/dx = 1 + dF/dx. The bypass contributes the constant 1 at every input; the branch contributes its own derivative. Worked instance: one scalar input and a constructed branch F(x) = x³ − 3x, so dF/dx = 3x² − 3, at three inputs. At x = 0 the branch's derivative is −3, so 1 + (−3) = −2: the sum is negative, and the plotted curve of dF/dx against x passes below zero. At x = 1 the branch's derivative is 0, so 1 + (0) = 1: the identity is the whole result. At x = 4 the branch's derivative is 45, so 1 + (45) = 46: the branch's term is 45 of the 46. The block's own output x + F(x) is 0, −1, 56 at those three inputs. In every row the identity adds the same 1 and cannot shrink, but it does not bound the sum: a branch slope below −1 puts the block's derivative below zero. In the symbol table, the three values in each example cell follow the table's row order, x = 0, 1, 4. This is one scalar toy, not a trained sublayer, and it says nothing about where a norm sits inside the branch.</desc>
