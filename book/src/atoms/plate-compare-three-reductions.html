<svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compare-three-reductions--ctr-title compare-three-reductions--ctr-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="compare-three-reductions--ctr-title">Three reductions of one 48-position string to a fixed width, and what each cannot carry</title>
        <desc id="compare-three-reductions--ctr-desc">Three panels hold one task. Each string holds 48 positions over four bases. The strings hold motif W and motif C in the two blocks. Motif W holds the bases G G G T G C in sequence. Motif C holds the bases T T T G T A in sequence. The label is the order of the two motifs. W comes first, or C comes first. The two classes hold the same bases and the same two motifs. Each panel draws two rows of 48 cells. A tall solid cell holds a motif W base. A short cell holds a motif C base. A grey cell holds one uniform random background base. The top row puts motif W at positions 4 to 9 and motif C at 38 to 43. The bottom row puts motif C at 4 to 9 and motif W at 38 to 43. Panel one averages the 48 positions. Each row gives four numbers, one for each base. The four numbers are A 0.167, C 0.208, G 0.271, T 0.354. The two rows give the same four numbers. Panel two flattens the string to 192 numbers. The two vectors differ in 24 of the 192 numbers. All 24 sit inside the 12 slots that hold a motif. Panel three slides a 6-wide filter per motif along the string. The filter gives a match count at each of the 43 starts. The reduction keeps the largest match count. Both rows give 6 and 6. The peak sits at start 4 in the top row and at start 38 in the bottom row. The maximum does not move. Softmax regression reads each reduced vector. All three panels use one loss, one optimiser and one seed. Only the reduction differs. The fit uses 1500 strings and the score uses 4000 strings. Chance is 0.5 in every cell. The average gives 0.4783 on the delivered slots and 0.4925 on the other quarters. The flatten gives 1.0000 and 0.4903. The window gives 0.5000 and 0.5000. The window bank holds the two motifs themselves. That bank is the best case for the window reduction. More filters cannot help. A maximum over positions does not depend on the place of the pattern.</desc>
