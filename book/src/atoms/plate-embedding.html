<figure data-atom="embedding" data-source="admin/diagrams/embedding.html" aria-label="An embedding lookup" style="margin:0;padding:0;background:#f5f5f5;color:#2d3142;font-family:'Geist',system-ui,sans-serif;border-radius:3px;overflow:hidden">
<svg viewBox="0 0 1280 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="embedding-title embedding-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="embedding-title">An embedding lookup</title>
        <desc id="embedding-desc">An integer id tensor of shape B×T on the left, holding ids 0 to 5. One cell, holding 4, is filled in accent, and an accent arrow runs straight from it into the row of the embedding table labelled 4, whose six rows are labelled 0 to 5 and whose eight columns are labelled with numbers. That single accent row leaves the table as an accent arrow annotated E[4] and arrives as the front card of a three-card stack, whose cells repeat the row's eight numbers in the same order and whose label reads B×T×d. No other row takes part. The key gives the model constants, four equations, a symbol glossary, and the equivalent torch.nn.Embedding call with comments mapping its arguments onto the drawing.</desc>

          <marker id="embedding-arrow-accent" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="96" y1="158" x2="264" y2="158" stroke="#4f5d75" stroke-width="1.2"/>
        <rect x="96" y="122" width="168" height="72" fill="none" stroke="#4f5d75" stroke-width="1.6"/>

        <rect x="222" y="158" width="42" height="36" fill="#bf4520"/>

        <g fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">
          <text x="117" y="144">2</text>
          <text x="159" y="144">5</text>
          <text x="201" y="144">0</text>
          <text x="243" y="144">3</text>

          <text x="159" y="180">0</text>
          <text x="201" y="180">3</text>

        <line x1="264" y1="176" x2="380" y2="176" stroke="#bf4520" stroke-width="2" marker-end="url(#embedding-arrow-accent)"/>

        </g>

        <text x="528" y="20" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">E</text>
        <text x="528" y="246" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">vocab×d</text>

        <!-- ══ COPIED OUT: the row leaves with its numbers in the same order,
             and lands as one d-vector in a stack of B×T of them. ══════════ -->
        <line x1="648" y1="176" x2="876" y2="176" stroke="#bf4520" stroke-width="2" marker-end="url(#embedding-arrow-accent)"/>
        <text x="762" y="167" fill="#bf4520" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">E[4]</text>

        <rect x="912" y="128" width="240" height="32" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="1.2"/>
        <rect x="896" y="144" width="240" height="32" rx="3" fill="#eaeaee" stroke="rgba(45,49,66,0.55)" stroke-width="1.2"/>
        <rect x="880" y="160" width="240" height="32" rx="3" fill="#bf4520"/>
        <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1">

        </g>

          <text x="895" y="180">.12</text><text x="925" y="180">−.84</text><text x="955" y="180">.31</text><text x="985" y="180">.05</text><text x="1015" y="180">−.47</text><text x="1045" y="180">.66</text><text x="1075" y="180">−.19</text><text x="1105" y="180">.38</text>

        <text x="1000" y="112" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">x</text>
        <text x="1000" y="216" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">B×T×d</text>

        <!-- ══ KEY: constants, equations, reference call ═══════════════════ -->
        <line x1="120" y1="312" x2="1160" y2="312" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <text x="120" y="336" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">MODEL</text>
        <text x="208" y="336" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">vocab = 6 · d = 8 · B = batch · T = positions</text>

        <line x1="120" y1="360" x2="1160" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

        <text x="120" y="384" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">TERM</text>
        <text x="200" y="384" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">EQUATION</text>

        <text x="120" y="410" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">Index</text>
        <text x="200" y="410" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">ids: integers in 0..vocab−1</text>

        <text x="120" y="436" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">Lookup</text>
        <text x="200" y="436" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">x = E[ids]</text>

        <text x="120" y="462" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">Shape</text>
        <text x="200" y="462" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">B×T → B×T×d</text>

        <text x="120" y="488" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">Table</text>
        <text x="200" y="488" fill="#2d3142" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">E: vocab×d, learned</text>

        <!-- ══ REFERENCE: the library call, kept apart from the key ════════ -->
        <line x1="780" y1="372" x2="780" y2="504" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <text x="812" y="384" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PYTORCH</text>

        <text x="812" y="410" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" xml:space="preserve">emb = nn.Embedding(</text>
        <text x="812" y="426" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" xml:space="preserve">    num_embeddings=vocab,   # rows of E</text>
        <text x="812" y="442" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" xml:space="preserve">    embedding_dim=d)        # width of a row</text>
        <text x="812" y="458" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" xml:space="preserve">emb.weight                  # E: vocab×d, learned</text>
        <text x="812" y="474" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" xml:space="preserve">x = emb(ids)                # E[ids], one row each</text>
        <text x="812" y="490" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" xml:space="preserve">                            # x: B×T×d</text>

        <!-- ══ SYMBOLS ═════════════════════════════════════════════════════ -->
        <line x1="120" y1="516" x2="1160" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="120" y="540" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SYMBOLS</text>

        <text x="120" y="566" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">ids</text>
        <text x="190" y="566" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">integer token ids, one per position</text>
        <text x="470" y="566" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">vocab</text>
        <text x="540" y="566" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">how many ids exist; rows of E</text>
        <text x="820" y="566" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">0..5</text>

        <text x="540" y="590" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">numbers in each row</text>
        <text x="820" y="590" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">B×T×d</text>
        <text x="890" y="590" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">one d-vector per position</text>

        <text x="190" y="638" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">row 4 of E; d numbers, same order</text>
        <text x="470" y="638" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">T</text>
        <text x="540" y="638" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">positions per sequence</text>
