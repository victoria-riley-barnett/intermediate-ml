<svg viewBox="0 0 1280 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trace-kmer-gene--trace-title trace-kmer-gene--trace-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="trace-kmer-gene--trace-title">One sequence, five shapes</title>
        <desc id="trace-kmer-gene--trace-desc">A 420-base DNA sequence is drawn as its first 90 bases in six rows of fifteen, then encoded as a vector of 1024 counts, one per distinct 5-mer, whose entries sum to 416 = 420 - 5 + 1. A Linear layer of shape 1024 by 7 turns that vector into 7 logits, +0.99 +0.84 +1.56 -1.62 +0.23 -0.87 +0.26. Softmax turns the 7 logits into 7 probabilities, 0.2080 0.1790 0.3678 0.0153 0.0973 0.0324 0.1002, which sum to exactly 1.0000. Cross-entropy reads the probability of the true class 4, which is 0.0973, and its -log is the loss, 2.3300. The 1024-slot vector is drawn as a 32 by 32 grid of cells, filled where the count is above zero, 337 of the 1024 slots. The loss exceeds ln 7 = 1.9459, the loss of a uniform guess, because the largest logit is class 2, not class 4. This figure is built on k = 5, whose 1024 slots a reader can hold; the delivered lab defaults to k = 6, 4096 slots, and searches k = 5, 6 and 7. The key gives the model constants, the four operations in flow order, the equivalent PyTorch lines and the seeds behind the numbers, and a glossary.</desc>
