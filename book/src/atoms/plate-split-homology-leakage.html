<svg viewBox="0 0 1280 658" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="split-homology-leakage--split-title split-homology-leakage--split-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="split-homology-leakage--split-title">One split changed, the held-out score followed: 4,380 gene sequences, random folds against folds cut by homology group</title>
        <desc id="split-homology-leakage--split-desc">Two panels over the same 4,380 5-mer count rows in seven gene families and the same multinomial naive Bayes classifier, differing only in which rows share a fold. Each panel is a grid of 28 homology-cluster columns, four per family, against seven fold rows; a mark means that cluster contributes rows to that fold's held-out set. In panel A the folds are drawn at random, every one of the 196 cells is filled and no cell holds more than 24% of its cluster, so each cluster sits partly in the fold and overwhelmingly in the training rows: held-out accuracy 0.9998. In panel B whole clusters are moved, 28 of the 196 cells are solid and each holds all of its cluster, so no cluster is ever on both sides: held-out accuracy 0.2978, fold by fold 0.1707, 0.1690, 0.4253, 0.3869, 0.4102, 0.2125, 0.3101; panel A scores 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 1.0000, 0.9984. Chance is 1/7 = 0.1429. Folds hold 625 to 626 rows in panel A and 587 to 654 in panel B, because the families are uneven; both means are unweighted over the seven folds. Panel B deals whole clusters to folds so that every fold holds four clusters from four different families. The model, the features, the seed and the row count are the same in both panels; the only thing that changed is the fold assignment.</desc>
