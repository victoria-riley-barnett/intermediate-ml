<svg viewBox="0 0 1280 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eq-mse-title eq-mse-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="eq-mse-title">Mean squared error</title>
        <desc id="eq-mse-desc">Mean squared error over four rows, and the derivative it hands back. The equation is MSE of w equals one over n times the sum over i of (w times x_i plus b minus y_i) squared. The four rows are four grid points of the week-02 lab's controlled regression, written to one decimal, with the noise set to zero: x_i = 0.8, 3.3, 6.7, 10.0, and y_i = 3x_i + 7, so y_i = 9.4, 16.9, 27.1, 37.0. The bias is held at b = 7.000, its true value, and n = 4. At w = 2.600 the four errors are -0.320, -1.320, -2.680, -4.000; their squares are 0.1024, 1.7424, 7.1824, 16.0000, which sum to 25.0272, and the mean of the squares is 6.2568. The same errors weighted by x_i are -0.2560, -4.3560, -17.9560, -40.0000, summing to -62.5680; times two over n that is -31.284, the slope of the loss with respect to w. The slope is -31.284 at w = 2.600, 0.000 at w = 3.000 and 31.284 at w = 3.400, so its sign orders the three candidates before any step is taken. The annotated step of 0.3128 is a chosen step size of 0.010 times the slope, not a derived one, and it lands at w = 2.9128, short of the bottom. The loss is 6.2568 at w = 2.600 and at w = 3.400 and 0.0000 at w = 3.000: because the four rows lie exactly on the line y = 3x + 7, the bottom is exactly at w = 3.000. That is a property of this one-parameter model with no noise on its data, not a claim that squared error has one minimum in general.</desc>
