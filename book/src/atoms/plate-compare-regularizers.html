<title id="compare-regularizers-title">Dropout against no dropout, five seeds each, one split</title>
<desc id="compare-regularizers-desc">Two panels compare the week 07 gene network trained with dropout probability 0.5 and with no dropout, five seeds each, on one split. Both settings hold 528,391 weights. The data hold 4,380 genes in 7 families, with 2,628 training, 876 held-out and 876 test genes. Panel one holds ten held-out loss curves over 60 epochs, five per setting. A faint line is one run; a bold line is the mean of the five runs at that epoch. A dashed rule at 1.95, the loss of an even guess over seven families, marks the no-information value. Every curve falls to a minimum and then climbs: between epochs 9 and 10 without dropout, between 14 and 17 with it. Panel two puts the final held-out loss of the five seeds of each setting on an axis from 0.70 to 0.92. A whisker runs from the lowest to the highest seed; a disc marks the mean. Without dropout the five seeds end between 0.8540 and 0.8894, mean 0.8728. With dropout they end between 0.7802 and 0.7988, mean 0.7876. The means are 0.0852 apart, which is 2.4 times the wider of the two five-seed ranges. Every one of the 25 no-dropout to dropout pairs is ordered the same way, and the closest approach between the two groups is 0.0552. The two settings differ only in the dropout probability: the data, the split seed 42, the weights, the epochs and the optimiser are the same. The log also holds a weight-decay run at the same weight count, with a five-seed mean of 0.8185 and a spread of 0.2784; it is reported in the key and is not drawn as a third arm. The page claims nothing about other datasets, about why dropout helps, or about seeds beyond the five it draws.</desc>
