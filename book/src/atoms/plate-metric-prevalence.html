        <title id="metric-prevalence-title">Accuracy is the commonest family&#8217;s share of the rows: 0.307 on 4,380 gene sequences</title>
        <desc id="metric-prevalence-desc">The seven gene families of a 4,380-row human gene artifact, as counts and as the share a no-model rule names right. Read from weeks/week06_multiclass/gene_family_data/human_data.txt and counted by the generator: class 0 GPCR 531, class 1 tyrosine kinase 534, class 2 tyrosine phosphatase 349, class 3 synthetase 672, class 4 synthase 711, class 5 ion channel 240, class 6 transcription factor 1343; the seven sum to 4,380. The left panel draws each count on an axis whose full length is all 4,380 rows, so a bar's length is also that family's share: 30.7% for the largest, 5.5% for the smallest. The right panel draws, for each family, the share of its rows that the null rule names right: that rule answers class 6 for every row and fits nothing, so its recall is 1.000 in that family and 0.000 in the other six, and its accuracy pooled over all rows is 1,343 / 4,380 = 0.3066, drawn as the bottom bar and rounded to 0.307 in the drawing. That pooled number is the prevalence-weighted mean of the seven recalls, 0.307 times 1.000 plus 0.693 times 0.000, so accuracy here is the commonest family's share of the rows. The rule is given the class counts of the same rows it is scored on: no split is drawn, so 0.3066 is the size of the floor, not a score on unseen rows. Every class has rows, so every 0.000 is measured and scikit-learn's 0/0 rule never fires. The uneven counts are the composition of the sample, not a defect in it, and no correction to the metric is drawn or recommended.</desc>
