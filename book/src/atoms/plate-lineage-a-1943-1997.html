<svg viewBox="0 0 1280 1578" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lineage-a-1943-1997--lin-title lineage-a-1943-1997--lin-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="lineage-a-1943-1997--lin-title">Architectures, 1943–1997</title>
        <desc id="lineage-a-1943-1997--lin-desc">Seven eras in two epochs. The first epoch studies one unit and its proven limit; the second studies a network that can be trained: error pushed back layer by layer, one filter reused at every position, a cell state carried forward by addition. Every row sits on the same grid, so a mark that comes back keeps its shape and its place. Continues in part two, 2012–2022.</desc>

        <text x="120" y="172" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">1943 – 1969</text><text x="212" y="172" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">a unit and its limit</text><line x1="120" y1="181" x2="1160" y2="181" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="206" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">1943</text><text x="176" y="206" fill="#5a6580" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">NEUROPHYSIOLOGY</text><text x="520" y="206" fill="#5a6580" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">IDEA</text><text x="120" y="234" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">McCulloch–Pitts</text><text x="120" y="262" fill="#2d3142" font-size="15" font-family="'Geist', system-ui, sans-serif">A set number of inputs must fire at once.</text><text x="120" y="286" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Inputs are counted, not weighted; one inhibitory input blocks</text><text x="120" y="303" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">the output. Count and wiring are set by hand, never fitted.</text><a class="citerow" data-href="https://doi.org/10.1007/BF02478259"><text x="120" y="338" fill="#5a6580" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">McCulloch &amp; Pitts 1943 · doi:10.1007/BF02478259</text></a><path d="M 560,247 L 686,264 M 560,264 L 686,264 M 560,281 L 686,264" fill="none" stroke="#4f5d75" stroke-width="1.8"/><path d="M 590,257 V 271" stroke="#2d3142" stroke-width="2.4"/><line x1="686" y1="264" x2="736" y2="264" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="740" y="242" width="130" height="44" rx="22" fill="#d5d5db" stroke="#bf4520" stroke-width="2.2"/><text x="805.0" y="271" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">≥ n</text><text x="120" y="402" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">1958</text><text x="176" y="402" fill="#5a6580" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">PERCEPTION</text><text x="520" y="402" fill="#5a6580" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">IDEA</text><text x="120" y="430" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">Rosenblatt</text><text x="120" y="458" fill="#2d3142" font-size="15" font-family="'Geist', system-ui, sans-serif">The rule adjusts weights after each wrong answer.</text><text x="120" y="482" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">A weight moves by the error times that weight's input.</text><text x="120" y="499" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Settles only if one straight cut splits both groups.</text><a class="citerow" data-href="https://doi.org/10.1037/h0042519"><text x="120" y="534" fill="#5a6580" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Rosenblatt 1958 · doi:10.1037/h0042519</text></a><rect x="560" y="438" width="130" height="44" rx="22" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/><text x="625" y="467" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Σ <tspan fill='#bf4520' font-weight='500'>w</tspan>·x</text><line x1="690" y1="460" x2="736" y2="460" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="740" y="438" width="130" height="44" rx="22" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/><text x="805.0" y="467" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">≥ θ</text><text x="120" y="598" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">1960</text><text x="176" y="598" fill="#5a6580" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">SIGNAL PROCESSING</text><text x="520" y="598" fill="#5a6580" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">IDEA</text><text x="120" y="626" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">LMS, ADALINE</text><text x="120" y="654" fill="#2d3142" font-size="15" font-family="'Geist', system-ui, sans-serif">Each weight steps downhill on the squared error.</text><text x="120" y="678" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Each weight moves by the error times its own input.</text><text x="120" y="695" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Needs a known target for every training input.</text><a class="citerow" data-href="https://www-isl.stanford.edu/~widrow/papers/c1960adaptiveswitching.pdf"><text x="120" y="730" fill="#5a6580" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Widrow &amp; Hoff 1960 · IRE WESCON Conv. Rec., pt 4</text></a><rect x="560" y="634" width="130" height="44" rx="22" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/><text x="625.0" y="663" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Σ w·x</text><line x1="690" y1="656" x2="736" y2="656" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="740" y="634" width="130" height="44" rx="22" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/><text x="805.0" y="663" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">− t</text><line x1="870" y1="656" x2="916" y2="656" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="920" y="634" width="130" height="44" rx="22" fill="#d5d5db" stroke="#bf4520" stroke-width="2.2"/><text x="985.0" y="663" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">e²</text><line x1="920" y1="696" x2="754" y2="696" stroke="#bf4520" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--ax)"/><text x="120" y="794" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">1969</text><text x="176" y="794" fill="#5a6580" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">MATHEMATICS</text><text x="520" y="794" fill="#5a6580" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">IDEA</text><text x="120" y="822" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">Minsky & Papert</text><text x="120" y="850" fill="#2d3142" font-size="15" font-family="'Geist', system-ui, sans-serif">No single flat cut separates XOR’s four cases.</text><text x="120" y="874" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Two cuts suffice, so a second layer of units would do.</text><text x="120" y="891" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Nothing in 1969 could set that second layer’s weights.</text><text x="120" y="908" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Parity of n bits needs one unit wired to all n inputs.</text><text x="120" y="926" fill="#5a6580" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Minsky &amp; Papert 1969 · MIT Press</text><rect x="560" y="830" width="130" height="44" rx="22" fill="#d5d5db" stroke="rgba(79,93,117,0.55)" stroke-width="1.2"/><text x="625.0" y="859" fill="#5a6580" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Σ w·x</text><line x1="690" y1="852" x2="736" y2="852" stroke="rgba(79,93,117,0.55)" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="740" y="830" width="130" height="44" rx="22" fill="#d5d5db" stroke="rgba(79,93,117,0.55)" stroke-width="1.2"/><text x="805.0" y="859" fill="#5a6580" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">≥ θ</text><line x1="870" y1="852" x2="912" y2="852" stroke="#bf4520" stroke-width="2.2" marker-end="url(#lineage-a-1943-1997--ax)"/><path d="M 929,845 L 943,859 M 943,845 L 929,859" fill="none" stroke="#bf4520" stroke-width="2.4"/><text x="120" y="990" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">1980s – 1997</text><text x="212" y="990" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">structure and credit</text><line x1="120" y1="999" x2="1160" y2="999" stroke="rgba(45,49,66,0.20)" stroke-width="1"/><text x="120" y="1024" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">1980s</text><text x="176" y="1024" fill="#5a6580" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">VISION</text><text x="520" y="1024" fill="#5a6580" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">IDEA</text><a class="rowlink" data-href="convolutional.html"><text x="120" y="1052" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">Neocognitron → LeNet</text></a><text x="120" y="1080" fill="#2d3142" font-size="15" font-family="'Geist', system-ui, sans-serif">One weight set is reused at every position.</text><text x="120" y="1104" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Each small patch is multiplied by the same weights.</text><text x="120" y="1121" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">One filter detects one pattern, so a layer needs many.</text><a class="citerow" data-href="https://doi.org/10.1162/neco.1989.1.4.541"><text x="120" y="1156" fill="#5a6580" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">LeCun et al. 1989 · doi:10.1162/neco.1989.1.4.541</text></a><a class="glyphlink" data-href="convolutional.html"><g fill="#d5d5db" stroke="#4f5d75" stroke-width="0.8"><rect x="544" y="1044" width="11" height="11"/><rect x="557" y="1044" width="11" height="11"/><rect x="570" y="1044" width="11" height="11"/><rect x="583" y="1044" width="11" height="11"/><rect x="596" y="1044" width="11" height="11"/><rect x="544" y="1057" width="11" height="11"/><rect x="557" y="1057" width="11" height="11"/><rect x="570" y="1057" width="11" height="11"/><rect x="583" y="1057" width="11" height="11"/><rect x="596" y="1057" width="11" height="11"/><rect x="544" y="1070" width="11" height="11"/><rect x="557" y="1070" width="11" height="11"/><rect x="570" y="1070" width="11" height="11"/><rect x="583" y="1070" width="11" height="11"/><rect x="596" y="1070" width="11" height="11"/><rect x="544" y="1083" width="11" height="11"/><rect x="557" y="1083" width="11" height="11"/><rect x="570" y="1083" width="11" height="11"/><rect x="583" y="1083" width="11" height="11"/><rect x="596" y="1083" width="11" height="11"/><rect x="544" y="1096" width="11" height="11"/><rect x="557" y="1096" width="11" height="11"/><rect x="570" y="1096" width="11" height="11"/><rect x="583" y="1096" width="11" height="11"/><rect x="596" y="1096" width="11" height="11"/></g><rect x="543" y="1043" width="37" height="37" rx="2" fill="none" stroke="#bf4520" stroke-width="2.2"/><line x1="654" y1="1082" x2="736" y2="1082" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="740" y="1060" width="130" height="44" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/><text x="805.0" y="1089" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">conv</text><line x1="870" y1="1082" x2="916" y2="1082" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="920" y="1060" width="130" height="44" rx="22" fill="#d5d5db" stroke="#4f5d75" stroke-width="1.2"/><text x="985.0" y="1089" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">pool</text></a><text x="120" y="1220" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">1986</text><text x="176" y="1220" fill="#5a6580" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">COGNITIVE SCIENCE</text><text x="520" y="1220" fill="#5a6580" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">IDEA</text><text x="120" y="1248" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">Backpropagation</text><text x="120" y="1276" fill="#2d3142" font-size="15" font-family="'Geist', system-ui, sans-serif">Computes the error's derivative for every weight.</text><text x="120" y="1300" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Each layer: local derivative × weighted sum from above.</text><text x="120" y="1317" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Cost: one backward pass, roughly one forward pass.</text><a class="citerow" data-href="https://doi.org/10.1038/323533a0"><text x="120" y="1352" fill="#5a6580" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Rumelhart et al. 1986 · doi:10.1038/323533a0</text></a><rect x="560" y="1256" width="130" height="44" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/><text x="625.0" y="1285" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">layer</text><line x1="690" y1="1278" x2="736" y2="1278" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="740" y="1256" width="130" height="44" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/><text x="805.0" y="1285" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">layer</text><line x1="866" y1="1318" x2="754" y2="1318" stroke="#bf4520" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--ax)"/><line x1="686" y1="1318" x2="574" y2="1318" stroke="#bf4520" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--ax)"/><text x="120" y="1416" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">1997</text><text x="176" y="1416" fill="#5a6580" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">SEQUENCE</text><text x="520" y="1416" fill="#5a6580" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace">IDEA</text><a class="rowlink" data-href="recurrent.html"><text x="120" y="1444" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">LSTM</text></a><text x="120" y="1472" fill="#2d3142" font-size="15" font-family="'Geist', system-ui, sans-serif">The cell state is added to, never overwritten.</text><text x="120" y="1496" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Gradient flows through sums, not a product of matrices.</text><text x="120" y="1513" fill="#4f5d75" font-size="12" font-family="'Geist', system-ui, sans-serif">Cost: four times the parameters of a plain cell.</text><a class="citerow" data-href="https://doi.org/10.1162/neco.1997.9.8.1735"><text x="120" y="1548" fill="#5a6580" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Hochreiter &amp; Schmidhuber 1997 · doi:10.1162/neco.1997.9.8.1735</text></a><a class="glyphlink" data-href="recurrent.html"><circle cx="536" cy="1474" r="4" fill="#bf4520"/><path d="M 536,1474 V 1438 Q 536,1430 544,1430 H 977 Q 985,1430 985,1438 V 1456" fill="none" stroke="#bf4520" stroke-width="2.4" marker-end="url(#lineage-a-1943-1997--ax)"/><rect x="560" y="1452" width="130" height="44" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/><text x="625.0" y="1481" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">cell</text><line x1="690" y1="1474" x2="736" y2="1474" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><rect x="740" y="1452" width="130" height="44" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/><text x="805.0" y="1481" fill="#2d3142" font-size="13" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">cell</text><line x1="870" y1="1474" x2="967" y2="1474" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#lineage-a-1943-1997--a)"/><circle cx="985" cy="1474" r="18" fill="#ffffff" stroke="#2d3142" stroke-width="1.8"/><path d="M 977,1474 H 993 M 985,1466 V 1482" fill="none" stroke="#2d3142" stroke-width="1.8"/></a>
