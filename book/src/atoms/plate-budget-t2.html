<title id="budget-t2-title">Every position compared with every other, counted at the course's sequence length</title>
<desc id="budget-t2-desc">At a sequence length of T = 12, an all-pairs comparison puts every position against every other: 12 positions, each compared with 12, which is 12 × 12 equals 144 comparisons. The same 12 positions read one at a time are 12 steps. Twelve slots on one centreline carry both counts for one sequence: 12 above each slot and 1 below it, and the two sum lines give 144 and 12. One plot draws both counts against the length: the all-pairs count is the curve T squared and the one-at-a-time count is the line T, and a dashed rule at T = 12, the width every week-08 batch was padded to, marks a point on each series. T squared divided by T is T, so the factor between the two series is the length itself. The figure counts operations and nothing else — pairs compared, steps taken — so no time, no memory, no FLOPs and no hardware are counted or claimed, and it does not say why a long input is hard to represent. The curve is arithmetic at every length; T = 12 is the length the course ran.</desc>
