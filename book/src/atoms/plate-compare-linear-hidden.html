        <title id="compare-linear-hidden--clh-title">A linear model and one hidden layer on the same 60 points</title>
        <desc id="compare-linear-hidden--clh-desc">The same sixty points in two panels on identical axes, minus two to two on both, one unit to one hundred and fifteen pixels. Thirty filled points sit inside a ring of thirty hollow points. In panel A a linear model, z equals x W plus b, draws one straight line across the box from y 0.16 on the left edge to y minus 0.39 on the right, and filled and hollow points fall on both of its sides. In panel B one hidden layer of four units, z equals ReLU of x W1 plus b1, times W2, plus b2, draws a closed six-sided loop around the thirty filled points, with every hollow point outside it. Each corner of the loop is a place where one hidden unit crosses zero. The number under each panel counts the straight segments the boundary is made of: one, and six.</desc>
