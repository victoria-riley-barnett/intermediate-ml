<figure data-atom="quiet-years" data-source="admin/diagrams/quiet-years.html" aria-label="The quiet years, 1998 to 2011" style="margin:0;padding:0;background:#f5f5f5;color:#2d3142;font-family:'Geist',system-ui,sans-serif;border-radius:3px;overflow:hidden">
<svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quiet-years--q-title quiet-years--q-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="quiet-years--q-title">The quiet years, 1998 to 2011</title>
        <desc id="quiet-years--q-desc">Three timelines from 1994 to 2012. The architecture lane runs from LSTM in 1997 to AlexNet in 2012 with a single hollow mark at pretraining in 2006, too small to scale, and nothing else for fifteen years. A second lane gives what the field taught instead: support vector machines in 1995, boosting in 1997 and random forests in 2001, all resting on hand-built features followed by a simple model. A third lane gives what arrived from elsewhere: CUDA in 2007, on hardware that video games funded, and ImageNet in 2009, crowdsourced. All three lanes meet at 2012, where the top five error was 15.3 percent against a next best of 26.2 percent.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

ist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="middle">2006 · pretraining, too small to scale</text><text x="640" y="200" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="middle">fifteen years, one false start, no new architecture</text><circle cx="1000.0" cy="180" r="4.5" fill="#bf4520"/><text x="986.04" y="200" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520" text-anchor="end">2012 · AlexNet</text><circle cx="187.8" cy="270" r="4.5" fill="#2d3142"/><text x="187.78" y="290" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">1995 · SVMs</text><circle cx="283.3" cy="270" r="4.5" fill="#2d3142"/><text x="283.34000000000003" y="290" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">1997 · boosting</text><circle cx="474.5" cy="270" r="4.5" fill="#2d3142"/><text x="474.46000000000004" y="290" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">2001 · forests</text><path d="M 172,310 V 316 H 490 V 310" fill="none" stroke="rgba(45,49,66,0.25)" stroke-width="1"/><text x="331.12" y="328" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75" text-anchor="middle">hand-built features, then a simple model</text><circle cx="761.1" cy="370" r="4.5" fill="#2d3142"/><text x="761.14" y="348" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">2007 · CUDA</text><text x="761.14" y="332" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="middle">video games funded the hardware</text><circle cx="856.7" cy="370" r="4.5" fill="#2d3142"/><text x="856.7" y="390" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">2009 · ImageNet</text><text x="856.7" y="406" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="middle">crowdsourced</text><line x1="1000" y1="158" x2="1000" y2="418" stroke="#bf4520" stroke-width="2"/><text x="1000" y="148" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520" text-anchor="middle" letter-spacing="0.14em">2012</text><text x="1000" y="454" font-size="20" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520" text-anchor="middle" font-weight="500">15.3%</text><text x="1000" y="474" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="middle">top-5 error, next best 26.2%</text><text x="120" y="540" font-size="13" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">The three pieces came from three fields, and all three existed by 2009.</text><text x="120" y="564" font-size="13" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">2012 added no idea; it put all three on one problem.</text>
