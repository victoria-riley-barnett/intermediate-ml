<figure data-atom="trace-state" data-source="admin/diagrams/trace-state.html" aria-label="A name holds one value at a time" style="margin:0;padding:0;background:#f5f5f5;color:#2d3142;font-family:'Geist',system-ui,sans-serif;border-radius:3px;overflow:hidden">
<svg viewBox="0 0 1280 930" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trace-state-title trace-state-desc" style="display:block;width:100%;height:auto;max-width:100%">
        <title id="trace-state-title">A name holds one value at a time</title>
        <desc id="trace-state-desc">Seven steps of a seven-line Python program, drawn as a vertical spine: the line that ran on the left; on the right the two fields of the dict that rec names, rec['n'] and rec['state'], and the name total; and the value the step wrote marked in accent. Step 1 binds rec to {'n': 12, 'state': 'ok'}; step 2 binds total to 0; step 3 tests rec['n'] &gt; 10, true; step 4 adds rec['n'] to total, 12; step 5 replaces rec['n'] with 7; step 6 tests again, false, so the loop body runs once; step 7 replaces rec['state'] with 'low'. Six values were written, three of them replacing a value already there: total 0 to 12, rec['n'] 12 to 7, rec['state'] 'ok' to 'low'; the other three are first bindings, the whole dict at step 1 and total at step 2. The program's print, boxed below the spine, wrote {'n': 7, 'state': 'low'} 12 - step 7's three values, and nothing about the six steps before it. The key gives the run, the three names, the snippet with each line's step number, and the marks. The figure draws only the names a reader can see: not frames, references, opcodes, or the dict's table.</desc>
