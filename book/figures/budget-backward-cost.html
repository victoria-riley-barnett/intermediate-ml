    <p class="eyebrow">WEEK 03 &middot; BACKPROPAGATION AND CHAIN RULE</p>
    <h1>Two sums back for every one forward</h1>
    <div class="diagram-container">
<svg viewBox="0 0 1280 969" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="budget-backward-cost-title budget-backward-cost-desc">
<title id="budget-backward-cost-title">One training step of a 3 to 4 to 2 model, counted in multiplies</title>
<desc id="budget-backward-cost-desc">A two-layer network reads three numbers, passes them through a 4 by 3 weight matrix, a ReLU, and a 2 by 4 weight matrix, and writes two output numbers. Its 20 weights are 12 in the first matrix and 8 in the second. The forward sweep applies each weight once: 12 + 8 equals 20. The backward sweep takes two weighted sums for the second layer, one for its weights and one for the gradient it hands down (dW2 8 and da1 8), and one for the first layer's weights (dW1 12); the gradient into the input is never computed because x is data, so backward is 28 multiplies against 20 forward, a ratio of 1.40. Forward plus backward is 48 multiplies, 2.40 forward passes. A bar shows those two stages to scale on an axis of multiplies. A second plot puts the same step cost on the vertical axis against s, the first layer's share of all weights, on the horizontal: the step cost is the line three minus s and the backward cost the line two minus s, so the first lies between two and three and the second between one and two for every model. Dots on the upper line mark the same 3 to 4 to 2 stack grown to 1, 2, 4, 8, 16 and 32 hidden layers; the drawn model sits at s = 0.60 and costs 2.40 forward passes.</desc>
