    <p class="eyebrow" style="font-size:10px; letter-spacing:0.14em;">WEEK 02 &middot; GRADIENT DESCENT</p>
    <h1>Six steps down a parabola</h1>
    <div class="diagram-container">
<svg viewBox="0 0 1280 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-gd-title code-gd-desc">
  <title id="code-gd-title">Gradient descent: the code, the printout and the curve</title>
  <desc id="code-gd-desc">Twelve lines of PyTorch on the left, the six lines they print below them, and the same run plotted on the right. The script holds one parameter at 2.0, squares it, calls backward, steps SGD with a learning rate of 0.1, and prints theta, loss and grad before each step. The printout gives theta 2.00000, 1.60000, 1.28000, 1.02400, 0.81920, 0.65536, losses 4.0000 down to 0.4295, grads 4.00000 down to 1.31072. The plot draws the curve L equals theta squared, marks the six printed points on it and joins them with arrows running down the curve toward the minimum at the origin, the gaps between the marks shortening as the curve flattens; a marked span of 0.40000 measures the first gap on the theta scale.</desc>
  <defs><marker id="code-gd-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#4f5d75"/></marker></defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="120" y="44" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">PYTORCH</text>
  <rect x="120" y="56" width="570" height="266" rx="8" fill="#eaeaee"/>
  <text x="152" y="86" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">1</text>
  <text x="168" y="86" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">import torch</text>
  <text x="152" y="105" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">2</text>
  <text x="152" y="124" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">3</text>
  <text x="168" y="124" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">theta = torch.tensor([2.0], requires_grad=True)</text>
  <text x="152" y="143" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">4</text>
  <text x="168" y="143" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">opt = torch.optim.SGD([theta], lr=0.1)</text>
  <text x="152" y="162" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">5</text>
  <text x="152" y="181" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">6</text>
  <text x="168" y="181" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">for step in range(6):</text>
  <text x="152" y="200" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">7</text>
  <text x="168" y="200" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">    loss = (theta ** 2).sum()</text>
  <text x="152" y="219" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">8</text>
  <text x="168" y="219" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">    loss.backward()</text>
  <text x="152" y="238" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">9</text>
  <text x="168" y="238" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">    print(f"step {step} theta {theta.item():.5f} "</text>
  <text x="152" y="257" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">10</text>
  <text x="168" y="257" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">          f"loss {loss.item():.4f} grad {theta.grad.item():.5f}")</text>
  <text x="152" y="276" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">11</text>
  <text x="168" y="276" xml:space="preserve" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520">    opt.step()</text>
  <text x="152" y="295" text-anchor="end" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">12</text>
  <text x="168" y="295" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">    opt.zero_grad()</text>
  <text x="120" y="354" font-size="10" letter-spacing="0.14em" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">OUTPUT</text>
  <rect x="120" y="366" width="570" height="162" rx="8" fill="#eaeaee"/>
  <text x="148" y="400" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">step 0 theta 2.00000 loss 4.0000 grad 4.00000</text>
  <rect x="132" y="410.0" width="3" height="16" fill="#bf4520"/>
  <text x="148" y="422" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">step 1 theta 1.60000 loss 2.5600 grad 3.20000</text>
  <text x="148" y="444" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">step 2 theta 1.28000 loss 1.6384 grad 2.56000</text>
  <text x="148" y="466" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">step 3 theta 1.02400 loss 1.0486 grad 2.04800</text>
  <text x="148" y="488" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">step 4 theta 0.81920 loss 0.6711 grad 1.63840</text>
  <text x="148" y="510" xml:space="preserve" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">step 5 theta 0.65536 loss 0.4295 grad 1.31072</text>
