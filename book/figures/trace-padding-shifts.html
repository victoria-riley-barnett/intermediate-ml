    <h1>Padding decides which slot each symbol lands in</h1>
    <div class="diagram-container">

        <title id="trace-padding-shifts-title">Padding decides which slot each symbol lands in</title>
        <desc id="trace-padding-shifts-desc">3 rows of 12 slots. Every row holds the same read, SxxT: the same 4 characters in the same order. The first row is padded on the right, S in slot 1, x in slots 2 and 3, T in slot 4; the second on the left, S in slot 9, x in slots 10 and 11, T in slot 12; the third is shifted one slot, S in slot 2, x in slots 3 and 4, T in slot 5. Under the cell that holds a character each row prints the 1-based slot that character occupies, joined by a short accent tick; the pad slots print no number. The characters keep their order and their spacing, T being 3 slots after S in every row, so the rows differ only in which slots the characters land in, and a reader that indexes by position receives three different arrangements of one read. The figure draws geometry only: no row is marked as the correct one, and no score appears, so it makes no claim that a model fails and none about why.</desc>
