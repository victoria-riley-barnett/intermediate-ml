    <h1>Scaled dot product</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eq-scaled-dot-product-title eq-scaled-dot-product-desc">
        <title id="eq-scaled-dot-product-title">Scaled dot product</title>
        <desc id="eq-scaled-dot-product-desc">The scaled dot product: A = softmax(q K transpose over the square root of d) times V, worked on one query against three keys of width four. The query is (1, 2, 1, 1); the keys are k1 = (1, 1, -1, -1), k2 = (1, 1, 1, -1), k3 = (1, 1, 1, 1). Each score is a dot product of four terms, written term by term: 1 times 1 plus 2 times 1 plus 1 times minus 1 plus 1 times minus 1, which is 1, for key 1; 1 times 1 plus 2 times 1 plus 1 times 1 plus 1 times minus 1, which is 3, for key 2; 1 times 1 plus 2 times 1 plus 1 times 1 plus 1 times 1, which is 5, for key 3. The values are v1 = (1, 0, 2, 0), v2 = (0, 2, 0, 1), v3 = (2, 0, 0, 1). The width is d = 4, so the divisor is √4 = 2 and the divided scores are (0.5, 1.5, 2.5): the same three keys in the same order, because dividing by a positive number cannot reorder them. The scores as summed give weights (0.016, 0.117, 0.867); the divided scores give (0.090, 0.245, 0.665). Their entropy, minus the sum of p ln p, is 0.441 for the summed scores and 0.833 for the divided ones, where a row that put a third of the weight on each key would be ln 3 = 1.099: the ranking is unchanged and the row is flatter. The layer uses the divided weights, so the output row is 0.090 times (1, 0, 2, 0) plus 0.245 times (0, 2, 0, 1) plus 0.665 times (2, 0, 0, 1), which is (1.42, 0.49, 0.18, 0.91). Weights are printed to three decimals, the divided scores and the output components are exact at one and two decimals; the sums on the page are sums of the printed digits. The division is dimensional rather than empirical: over d independent entries of unit variance the dot product's mean square is exactly d, so its typical size is the square root of d and the divided score's typical size is one whatever the width. Nothing here is a claim about accuracy, and no training result is drawn.</desc>
