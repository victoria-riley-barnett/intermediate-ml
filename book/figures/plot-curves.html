    <p class="eyebrow">Week 07 &middot; Generalization</p>
    <h1>Training loss, held-out loss, and the gap</h1>
    <div class="diagram-container">
<svg viewBox="0 0 1280 932" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plot-curves-title plot-curves-desc">
<title id="plot-curves-title">Training loss and held-out loss over 60 epochs, one run</title>
<desc id="plot-curves-desc">Two cross-entropy loss curves from one training run of the week 07 gene network: 4,380 genes, 7 families, 1,024 five-mer features, split 2,628 training, 876 held-out, 876 test. The horizontal axis is epoch, 1 to 60; the vertical axis is cross-entropy loss, zero to two. The training curve falls from 1.169 at epoch 1 to 0.001 at epoch 60. The held-out curve falls with it to its lowest value, 0.620, at epoch 10, then rises to 0.872 by epoch 60. The gap between the two curves at epoch 60 is 0.871; at the lowest held-out value it was 0.540. A dashed rule at 1.95, ln 7, marks the loss of an even guess over seven families, and the held-out curve never returns to it. The chapter reads the growing distance between the two curves as the network memorising the training genes rather than learning the pattern. This is one run, seed 0 of the five the lab trains: the turning point belongs to this run, and the page states no seed-to-seed spread.</desc>
