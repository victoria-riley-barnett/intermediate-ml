    <p class="eyebrow">WEEK 11 &middot; ATTENTION</p>
    <h1>A mask removes terms from one average</h1>
    <div class="diagram-container">
<svg viewBox="0 0 1280 858" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-mask-title arch-mask-desc">
<title id="arch-mask-title">A mask removes terms from one average</title>
<desc id="arch-mask-desc">Two 12 by 12 grids of attention weights, side by side, both over the same 144 scores. The left grid is full: each of the 12 positions divides its row of 12 scores by all 12 keys, so row i is a weighted average over 12 value vectors, and every row sums to 1.00. The right grid is causal: the 66 cells above the diagonal are struck through at the weight they would have had, and each row divides only by the keys it keeps, so row 1 averages one value, row 2 two, up to row 12 which loses nothing and divides by all 12. The 78 kept cells are renormalised and every row again sums to 1.00: the same softmax, the same scores, a different set of contributors. The third column of the right grid shows, per row, the row sum before that division, 0.05 in row 1 and 1.00 in row 12 — the number that is not 1.00, and the reason the division is part of the mask rather than an afterthought. The padded length 12 and the batch row are read from the week-8 run log, where 8 of the 12 slots carry a pad mask rather than a causal one; d = 32 features and h = 4 heads are the week-11 lab's, so d_h = 8. The scores themselves are a worked matrix at those sizes, not one batch's output: the delivered model cannot be re-run here. Causal masking is not required for an encoder, which is what the course builds; the right panel is drawn because the mask is met elsewhere. What is drawn is one row's weighted sum, and the mask removes terms from it: nothing here says a position cannot reach another, and nothing here says what the surviving terms carry. A key states the model's sizes, the equations, the equivalent PyTorch calls, and every symbol.</desc>
