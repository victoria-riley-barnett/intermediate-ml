    <p class="eyebrow">WEEK 01 &#183; TENSORS</p>
    <h1>A shape can be checked before any value is</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 976" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trace-shape-title trace-shape-desc">
        <title id="trace-shape-title">A shape can be checked before any value is</title>
        <desc id="trace-shape-desc">Five of the week-01 lab's own lines, one per row, with the shape each leaves, its dtype and the axis it uses up. The table arrives as (344, 7); dropna removes 11 of the 344 rows for the 19 missing cells and leaves (333, 7); one tensor conversion keeps 4 of the 7 columns and leaves (333, 4), float32; one-hot encoding replaces the single label column with 3 and leaves (333, 3); and multiplying one one-hot row by the (3, 4) table of per-species means matches the inner 3s and leaves (4,), rank 1. Four of the five lines use an axis up; all five shapes differ. No value from the penguin table appears in the drawing, and the shapes were read out of the lab's own text and the split-train-only figure rather than recomputed, because the penguin CSV is not on this machine. The last block names the limit: the pair (333, 4) and (3,) is caught because the inner numbers disagree, before any value is read; reordering the features list, or the one-hot row, changes no shape at all and is not caught.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <text x="150" y="44" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end" letter-spacing="0.14em">STAGE</text>
        <text x="176" y="44" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" letter-spacing="0.14em">OPERATION</text>
        <text x="735" y="44" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="middle" letter-spacing="0.14em">SHAPE AFTER</text>
        <text x="860" y="44" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="middle" letter-spacing="0.14em">DTYPE</text>
        <text x="930" y="44" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" letter-spacing="0.14em">AXIS CONSUMED</text>
        <line x1="120" y1="60" x2="1160" y2="60" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>
        <line x1="140" y1="68" x2="140" y2="364" stroke="rgba(45,49,66,0.2)" stroke-width="1.2"/>
        <text x="150" y="104" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end">1</text>
        <text x="176" y="100" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">penguins = sns.load_dataset('penguins')</text>
        <text x="735" y="102" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">(344, 7)</text>
        <text x="860" y="101" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="middle">per column</text>
        <text x="930" y="100" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">— · nothing used up</text>
        <text x="930" y="117" font-size="10" font-family="'Geist', system-ui, sans-serif" fill="#5a6580">a read: the table arrives, 7 columns wide</text>
        <text x="150" y="166" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end">2</text>
        <text x="176" y="162" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">df = penguins.dropna().reset_index(drop=True)</text>
        <text x="735" y="164" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">(333, 7)</text>
        <text x="860" y="163" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="middle">per column</text>
        <text x="930" y="162" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">0 · 11 of 344 rows removed</text>
        <text x="930" y="179" font-size="10" font-family="'Geist', system-ui, sans-serif" fill="#5a6580">11 rows, out of 19 missing cells</text>
        <text x="150" y="228" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end">3</text>
        <text x="176" y="224" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">X = torch.tensor(df[features].to_numpy(), dtype=torch.float32)</text>
        <text x="176" y="241" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">features: bill_length_mm · bill_depth_mm · flipper_length_mm · body_mass_g</text>
        <text x="735" y="226" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">(333, 4)</text>
        <text x="860" y="225" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="middle">float32</text>
        <text x="930" y="224" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">1 · 4 of 7 columns kept</text>
        <text x="930" y="241" font-size="10" font-family="'Geist', system-ui, sans-serif" fill="#5a6580">3 dropped: species · island · sex</text>
        <text x="150" y="290" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end">4</text>
        <text x="176" y="286" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">S = one_hot(df['species'], species_names)</text>
        <text x="176" y="303" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">species_names = sorted(df['species'].unique())</text>
        <text x="735" y="288" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">(333, 3)</text>
        <text x="860" y="287" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="middle">float32</text>
        <text x="930" y="286" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">1 · 1 of 7 columns taken</text>
        <text x="930" y="303" font-size="10" font-family="'Geist', system-ui, sans-serif" fill="#5a6580">replaces 1 column with 3 columns</text>
        <text x="150" y="352" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end">5</text>
        <text x="176" y="348" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">adelie @ per_species</text>
        <text x="176" y="365" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">per_species (3, 4): df.groupby('species')[features].mean()</text>
        <text x="735" y="350" font-size="15" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="middle">(4,)</text>
        <text x="860" y="349" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="middle">float32</text>
        <text x="930" y="348" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">axis 0 of both · 3 against 3</text>
        <text x="930" y="365" font-size="10" font-family="'Geist', system-ui, sans-serif" fill="#5a6580">matches the inner axes and removes them</text>
        <line x1="120" y1="382" x2="1160" y2="382" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>
        <text x="120" y="404" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">5 stages · 5 different shapes · 4 consume an axis · 4 are rank 2, 1 is rank 1</text>
        <rect x="120" y="422" width="540" height="104" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1.2"/>
        <text x="136" y="440" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" letter-spacing="0.14em">THE LAST SHAPE</text>
        <text x="136" y="462" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">adelie @ per_species</text>
        <text x="136" y="494" font-size="20" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">(4,)</text>
        <text x="230" y="494" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">step 5 · (333, 3) against (3, 4)</text>
        <text x="136" y="512" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">the drawing holds shapes, not values</text>
        <text x="700" y="440" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" letter-spacing="0.14em">CAUGHT, AND NOT CAUGHT</text>
        <text x="700" y="470" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520">(333, 4) @ (3,)</text>
        <text x="836" y="470" font-size="10.5" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">caught before any value is read</text>
        <text x="700" y="494" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">features, reordered</text>
        <text x="836" y="494" font-size="10.5" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">not caught: every shape above unchanged</text>
        <text x="700" y="518" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">adelie, reordered</text>
        <text x="836" y="518" font-size="10.5" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">not caught: same shapes, another species</text>
        <text x="120" y="548" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">the operation column copies the lab's lines as written · each shape is read after its line</text>
        <text x="120" y="566" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">row 4 starts from df, not from row 3 · row 5 multiplies a hand-built one-hot row by per_species</text>
        <text x="120" y="584" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">not drawn: the 333 rows, their values, the 19 missing cells, the per-column dtypes</text>
        <text x="120" y="600" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">the order of rows and columns is chosen and stated in the source, not given: a table read the other way round is a different pipeline, not an error</text>
        <line x1="120" y1="616" x2="1160" y2="616" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>
        <line x1="120" y1="664" x2="1160" y2="664" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>
        <text x="120" y="688" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" letter-spacing="0.14em">COLUMN</text>
        <text x="248" y="688" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" letter-spacing="0.14em">WHAT IT HOLDS</text>
        <text x="120" y="714" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" font-weight="500">STAGE</text>
        <text x="248" y="714" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">the ordinal; one per line the lab runs</text>
        <text x="120" y="740" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" font-weight="500">OPERATION</text>
        <text x="248" y="740" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">the lab's line, copied as written</text>
        <text x="120" y="766" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" font-weight="500">SHAPE AFTER</text>
        <text x="248" y="766" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">(rows, columns), the lab's reading of .shape</text>
        <text x="676" y="714" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" font-weight="500">DTYPE</text>
        <text x="804" y="714" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">one per tensor; a table has one per column</text>
        <text x="676" y="740" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" font-weight="500">AXIS CONSUMED</text>
        <text x="804" y="740" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">which dimension the line used up</text>
        <text x="676" y="766" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" font-weight="500">features</text>
        <text x="804" y="766" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">the four measurement columns, in this order</text>
        <line x1="640" y1="664" x2="640" y2="766" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>
        <line x1="120" y1="820" x2="1160" y2="820" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>
        <text x="120" y="844" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" letter-spacing="0.14em">MARKS</text>
        <text x="120" y="874" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">—</text>
        <text x="200" y="874" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">read only: no axis used up</text>
        <text x="560" y="874" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">per column</text>
        <text x="660" y="874" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">a table holds one dtype per column</text>
        <text x="120" y="898" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">1 · 4 of 7</text>
        <text x="200" y="898" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">axis number, then how much of it went</text>
        <text x="560" y="898" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">float32</text>
        <text x="660" y="898" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">from the line's dtype=, or the tensor it is checked equal to</text>
        <text x="120" y="922" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">(333, 7)</text>
        <text x="200" y="922" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">rows, then columns; one number per dimension</text>
        <text x="560" y="922" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520">accent</text>
        <text x="660" y="922" font-size="11" font-family="'Geist', system-ui, sans-serif" fill="#4f5d75">a pair whose inner numbers disagree</text>
      </svg>
    </div>
