    <p class="eyebrow">WEEK 09 &#183; EMBEDDING</p>
    <h1>The target residue is never in its own context</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 1190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trace-context-window-title trace-context-window-desc">
        <title id="trace-context-window-title">The target residue is never in its own context</title>
        <desc id="trace-context-window-desc">A window of 7 residue slots for one prediction. The centre slot, id 7, is marked held out and is not looked up; the 6 neighbours around it are ids 0, 9, 17, 2, 8, 5, which are looked up as 6 rows of 8 numbers in a table of 20 rows. The rows are A [2, 0, 0, 0, 0, 0, 0, 0], L [1, 1, 0, 0, 0, 0, 0, 0], V [0, 2, 0, 0, 0, 0, 0, 0], D [2, 0, 0, 0, 0, 0, 0, 0], K [1, 1, 0, 0, 0, 0, 0, 0], G [0, 2, 0, 0, 0, 0, 0, 0]. Added column by column the 8 columns total 6, 6, 0, 0, 0, 0, 0, 0; divided by 6 that is the pooled row [1, 1, 0, 0, 0, 0, 0, 0], which is the same for any order of the 6 rows - the mean keeps no record of which neighbour sat where, and that blindness is what attention-worked repairs. A linear head gives the target score ln 4 = 1.386 and the other 19 scores 0, so softmax gives the target p = 4/23 = 0.174 and each other residue 1/23 = 0.043, 20 values summing to 1; the denominator 23 is the sum of the exponentials, not a vocabulary size. The rows are the week-09 lecture's illustrative table, chosen for arithmetic and not trained, and the pooled row is used for one prediction rather than as a description of a residue. The key gives the model, the four operations, the Pytorch calls and the symbols.</desc>
