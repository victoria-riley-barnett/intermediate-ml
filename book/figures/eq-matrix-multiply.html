    <h1>Matrix multiply</h1>
    <div class="diagram-container">

        <title id="matmul-title">Matrix multiply</title>
        <desc id="matmul-desc">Matrix multiplication C = A B, and the single cell Cij written as the sum over k of Aik times Bkj. A is a 2 by 3 grid, B is 3 by 2, so C is 2 by 2. The cell C12 is traced by hand: row 1 of A is 2, 1, 3 and column 2 of B is 2, 1, 5, so the products are 2·2 = 4, 1·1 = 1 and 3·5 = 15, which add to 20. The other cells are 11, 17 and 16. The size rule is (m×k)(k×n) → m×n: the inner k must match, so A 2×3 with B 2×3 has no k to pair.</desc>
