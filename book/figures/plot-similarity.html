    <p class="eyebrow">WEEK 09 · EMBEDDING</p>
    <h1>Similarity over two coordinates can disagree with similarity over all eight</h1>
    <div class="diagram-container">
<svg viewBox="0 0 1280 1146" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plot-similarity-title plot-similarity-desc">
<title id="plot-similarity-title">Cosine to A over two coordinates and over all eight</title>
<desc id="plot-similarity-desc">Three constructed eight-dimensional vectors, A = [1, 0, 0, 0, 0, 0, 0, 0], B = [0.9, 0.1, 4, 0, 0, 0, 0, 0], C = [0.8, 0.2, 0, 0, 0, 0, 0, 0]. The left panel plots coordinates 1 and 2 on axes of equal scale: A lies on the coordinate-1 axis, B reaches 0.9 and 0.1, C reaches 0.8 and 0.2. Drawn at true angles, the direction to B is 6.3 degrees from A and the direction to C is 14.0, so B is the nearer of the two to A in this view. The right panel puts both cosines on one axis from zero to one, four rows: over coordinates 1 and 2, cos(A,B) is 0.9939 and cos(A,C) is 0.9701, B nearer A by 0.0237; over all eight coordinates, cos(A,B) is 0.2194 and cos(A,C) is 0.9701, C nearer A by 0.7507. The two views therefore disagree about which vector is nearer A. C's value is identical in both views because coordinates 3 to 8 are zero for A and for C; B's falls because its coordinate 3 is 4, 95 percent of its squared length, and the left panel cannot show it. The eight-coordinate value is the one a model computes; the two-coordinate ordering is a property of the picture, and these vectors are constructed rather than the result of any fit, so neither panel is a projection of a trained embedding.</desc>

>0.9939</text><circle cx="1020.294" cy="519.5" r="4.6" fill="#2d3142"/><text x="120" y="523.500" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">cos(A, C) · coordinates 1–2</text><text x="1150" y="524.500" font-size="13" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="end" font-weight="500">0.9701</text><circle cx="524.835" cy="564.5" r="4.6" fill="#2d3142"/><text x="120" y="568.500" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">cos(A, B) · all 8 coordinates</text><text x="1150" y="569.500" font-size="13" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142" text-anchor="end" font-weight="500">0.2194</text><circle cx="1020.294" cy="609.5" r="4.6" fill="#bf4520"/><text x="120" y="613.500" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">cos(A, C) · all 8 coordinates</text><text x="1150" y="614.500" font-size="13" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520" text-anchor="end" font-weight="500">0.9701</text><text x="120" y="700" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" fill="#2d3142">coordinates 1–2: B nearer A by 0.0237      ·      all 8 coordinates: C nearer A by 0.7507</text><text x="120" y="732" font-size="13" font-family="'Geist', system-ui, sans-serif" fill="#5a6580">Neither value is wrong: each measures the coordinates it was given. A model compares all eight, so the left panel's ordering belongs to coordinates 1 and 2 alone.</text>
