    <h1>Right inside the frame, at chance outside it</h1>

    <div class="diagram-container">

        <title id="compare-three-readers-title">Three readers of the same strings, scored on five tests</title>
        <desc id="compare-three-readers-desc">A score table: three readers of a string down the rows, five tests across the columns. Each cell is the share of strings answered right, averaged over ten runs from different starting points, with the spread beside it: 4 000 training strings in the first column and 2 000 held-out strings in each of the other four. The task is the delivered one: a string holds exactly one S and one T and the rest x, and the answer is whether S comes before T. The five tests are the training strings; new strings of the training lengths; new strings longer than any training string; the same held-out strings padded on the left; and the same held-out strings shifted one slot. Guessing scores 0.50. The counting reader scores 0.57, 0.52, 0.50, 0.52, 0.52. Its four held-out cells sit at chance, because SxxT and TxxS have identical counts, and the last three repeat one number because place does not enter its features at all. The flattened reader scores 1.00, 1.00, 0.78, 0.36, 0.95. It reads twelve slots and nothing else, so a string of the training lengths arrives whole and a longer one arrives cut short. The two marked cells are the tests that move a marker into slots 9 to 12 for at least one string in five: 43% on the longer strings and 91% when the strings are padded on the left. The mark is a stated convention, not a score cut: on the one-slot shift only 6% of the strings move a marker out of slots 1 to 8 and 0.37 of those are answered right, so that cell is drawn but not marked. Its 0.78 is not partial credit: 0.571 of the longer strings keep both markers inside slots 1 to 8 and are answered right there, 0.429 put a marker in slots 9 to 12 and are answered at 0.48. The recurrent reader scores 1.00, 1.00, 1.00, 0.76, 0.91, with spreads of 0.21 and 0.18 on the two position tests. The key states the sizes, the marks, the source, the symbols and the library calls.</desc>
