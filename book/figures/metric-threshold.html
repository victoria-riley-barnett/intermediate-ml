    <p class="eyebrow">Week 05 &middot; Evaluation and metrics</p>
    <h1>Right ninety percent of the time, and useless</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 1068" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metric-threshold-title metric-threshold-desc">
        <title id="metric-threshold-title">Accuracy, recall and error cost at two decision thresholds on 200 screening rows</title>
        <desc id="metric-threshold-desc">Three decision rules applied to the same 200 held-out screening rows, drawn as a grid in which one square is one row: the top line of 20 squares is the diseased rows and the nine lines below are the 180 healthy rows. The no-model rule flags nothing: accuracy 0.900, recall 0.000, and precision has no value because no row was ever flagged. The cut at 0.90 catches 3 of 20, misses 17, raises 2 false alarms and clears 178: accuracy 0.905, recall 0.150, precision 0.600, F1 0.240. The cut at 0.20 catches 16, misses 4, raises 41 false alarms and clears 139: accuracy 0.775, recall 0.800, precision 0.281, F1 0.416. Counting one missed case as ten unnecessary follow-up tests, the three rules cost 200, 172 and 81, so the two cuts trade places at a cost ratio of 3. Accuracy is highest exactly where the misses are worst. The key states the counts, the marks, the source, the symbols and the scikit-learn calls.</desc>

        <text x="1160" y="52" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580" text-anchor="end" letter-spacing="0.14em">ONE SQUARE = ONE ROW</text>
