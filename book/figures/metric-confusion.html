    <p class="eyebrow">WEEK 05 &middot; EVALUATION</p>
    <h1>Eight ion channels named wrong, inside an accuracy of 0.978</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 1150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metric-confusion-title metric-confusion-desc">
        <title id="metric-confusion-title">A 7x7 confusion matrix of the gene-family model on 876 held-out genes, raw and row-normalised</title>
        <desc id="metric-confusion-desc">The seven-by-seven confusion matrix of the week-06 lab's gene-family model on 876 held-out human gene sequences, split from the 4380-gene corpus by np.random.default_rng(42).permutation and 80/20, seed 42. Rows are the true family, columns the family the model named, and one cell is one gene. Panel A gives the raw counts: the diagonal holds 857 genes, so the off-diagonal 19 are wrong. Per family the support is GPCR 100, tyrosine kinase 130, tyrosine phosphatase 61, synthetase 139, synthase 121, ion channel 44, transcription factor 281; column totals are 105, 127, 61, 136, 120, 36, 291. Panel B divides each row by its own n and prints one decimal, so a row of shares sums to 100 within 0.1: ion channel keeps 81.8% of its 44 genes, transcription factor keeps 99.6%. The largest single off-diagonal cell is 6 genes, ion channel named GPCR: the most frequent error, and the matrix gives no reason to call it the important one. 11 of the 19 errors land in column 6. With a flat cost each error costs 1 and the total is 19; that weighting is a choice the matrix cannot supply. Accuracy is 0.978, 857 of 876, and it is the last row of the scalar stack because it is the one that hides the rest. The key states the model, the marks, the source, the symbols and the scikit-learn calls.</desc>
