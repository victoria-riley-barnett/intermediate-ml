[[steps]]
claim = "A shared filter finds a local motif wherever it occurs."
see = ["architectures"]
figure = "convolutional"
source = "week 10 lecture, Slide a window"
source_passage = """
This is the right tool for the local job. A kernel slid along the grid, with its weights shared across positions, detects a motif wherever it occurs, at the cost of one detector rather than `L` of them. Stationarity and position-equivariance are exactly the assumptions a sequence motif licenses.
"""
