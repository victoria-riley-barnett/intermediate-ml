"""

[[steps]]
claim = "A matching pair of sequences can carry opposite labels in a different order."
figure = "compare-three-reductions"
source = "week 10 lecture, A controlled toy"
source_passage = """
That last sentence is the whole design. A positive and the matching negative are permutations of each other, ingredient for ingredient. Anything reading the multiset of rows cannot tell them apart, and anything reading only a local neighbourhood sees one motif at a time with no way to compare the two.

All three candidates fail for the reasons already given. The average maps the pair to the same vector, by construction. Flattening can represent the order, since the two placements occupy different coordinates, but each offset carries its own weights, so the network learns where the motifs sit rather than which came first. The window learns `WWW` and it learns `CCC`, then pools over positions and loses which one came first; relaying between them costs depth proportional to the gap.
"""
