[[steps]]
claim = "Flattening preserves order but fixes the width and gives positions private weights."
source = "week 10 lecture, Flatten"
source_passage = """
The case for it: order is preserved exactly, nothing is discarded, and a linear layer on top can in principle compute any function of the ordered grid. Two costs come with that.

The width is fixed at construction. `nn.Linear(L*d, h)` commits to one `L`. A protein of another length does not fit the matrix; padding to a chosen maximum discards residues past it, and truncating a two-thousand-residue protein to 512 throws away most of it.

The parameters scale with length. The first weight matrix holds `L*d*h` numbers, and every position gets its own private block of them. At `L = 48`, `d = 20`, `h = 64` that is 61,440 weights in the first layer; at `L = 1024` it is 1.3 million. The count grows with `L` indefinitely. Those weights are also unshared, so a motif learned at positions 2–4 must be learned again from scratch at 40–42, each copy needing its own examples. Position pairs compound it: a label that conjoins an event at `i` with an event at `j` is a distinct conjunction for each of the `O(L²)` pairs, and the training set has to cover them. Nothing in the architecture states that two positions play the same role.
"""
