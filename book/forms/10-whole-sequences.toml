[[steps]]
claim = "A classifier wants a fixed-width vector, but sequence length varies."
see = ["09-embeddings"]
source = "week 10 lecture, The shape of the object"
source_passage = """
Row `i` is the vector for whatever residue sits at position `i`; columns are the learned features. `L` varies — sixty for a peptide, a few thousand for a kinase. A classifier is a stack of matrix multiplies ending in a fixed number of logits, so it consumes a vector of fixed width. The mismatch is a shape mismatch: `(L, d)` with variable `L` against an interface that wants a fixed-size vector. Every remedy is a map from variable-length grids to fixed vectors, and the choice of map is a claim about what in the sequence carries the answer.
"""
