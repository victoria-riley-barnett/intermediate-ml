[[steps]]
claim = "Biological dependencies can join positions far apart in the sequence."
see = ["11-attention"]
source = "week 10 lecture, Where biology does this"
source_passage = """
Two cases, stated as narrowly as the evidence supports them.

Enhancers regulate promoters across tens of thousands of base pairs, with much of the intervening sequence irrelevant to the regulation. A dependency holds between two short elements far apart on the linear genome; a window of a few dozen bases sitting on one of them sees nothing of the other.

In a folded protein, residues that sit in contact are frequently far apart in the chain: the tertiary contacts holding a domain together can join positions a hundred or more residues apart, while chain neighbours may be close in space and unrelated in function. What matters here is distance along the sequence, not any claim that sequence alone determines structure.

Both cases have the structure the toy encodes. The label depends on a relation between two positions, and that distance is large.
"""
