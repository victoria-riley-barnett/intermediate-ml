[[steps]]
claim = "Averaging rows makes every length fit, but erases their order."
see = ["08-fixed-size-inputs"]
source = "week 10 lecture, Average the rows"
source_passage = """
The case for it is real: the output has `d` numbers whatever `L` is, it costs almost nothing, and every position contributes. A sum over positions does not care what order the terms arrive in, and that indifference is the defect. Permute the rows of `X` and the column means do not change.

Consider two strings of the same length. The first holds three tryptophans contiguously at positions 2–4 and three cysteines at 44–46, with filler elsewhere. The second is that same string with its rows permuted so the tryptophans land at 2, 20 and 33 and the cysteines at 5, 25 and 45. The multiset of rows is identical, so `X.mean(axis=0)` is identical, bit for bit. Any classifier is a function of its input, so the two strings receive the same output. No weight, no depth, no quantity of data can separate them. This is not a claim that averaging performs poorly; it is a proof that the pooled vector does not contain the distinction. Mean is not special — sum, max, and any function of the row multiset alone inherit the same blind spot.
"""
