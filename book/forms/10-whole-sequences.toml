[[steps]]
claim = "A convolution's receptive field grows with each stacked layer."
see = ["11-attention"]
figure = "eq-conv-window"
source = "week 10 lecture, Slide a window"
source_passage = """
The limit is the receptive field. One convolution of width `k` lets each output position depend on `k` input positions. Stacking layers of width `k` adds `k - 1` positions per layer:

```python
def receptive_field(depth, k):
    return 1 + depth * (k - 1)    # k=5: depth 1 -> 5, depth 10 -> 41
```

A single output depends only on positions inside that span. With `k = 5` and two motifs whose starts differ by 40 positions, at least ten layers must sit between the input and any output that sees both, and each of those layers is a mixing step whose weights must learn to carry both signals forward intact. It can be done; dilated convolutions widen the span faster. But the depth needed is set by the longest distance in the data, which is neither known at construction nor bounded by anything in the layer. The locality that makes the window good at motifs is the same property that makes binding distant positions a matter of piling up layers.
"""
text = """
