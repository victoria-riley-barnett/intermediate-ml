[[steps]]
claim = "`nn.Module` holds a network's parameters, forward pass, and gradients."
see = ["02-autodifferentiation"]
source = "week04_nn/lab.md, Second rung: nn.Module"
source_passage = """
`nn.Module` is PyTorch's base class for models. Subclass it, register your parameters in `__init__`, define `forward`, and the bookkeeping comes for free: `.parameters()` returns exactly the list we used to write by hand, and `.zero_grad()` clears every gradient at once. Every model in PyTorch speaks this protocol.
"""
