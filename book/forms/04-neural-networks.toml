[[steps]]
claim = "Each layer takes the previous layer's output as its input."
see = ["06-multiclass"]
source = "week04_nn/lab.md, Neural Networks"
figure = "feedforward"
source_passage = """When we stack multiple layers of neurons together, we get a **multi-layer neural network**, which can be used to model more complex relationships between features and the target variable. Each layer of neurons takes in the output of the previous layer as its input, allowing the network to learn hierarchical representations of the data.

Hidden layers are the layers of neurons that are not directly connected to the input or output of the network. These layers allow the network to learn more complex representations of the data, and they are critical for the success of deep learning models."""
