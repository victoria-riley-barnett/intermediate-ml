"""

[[steps]]
claim = "`TensorDataset` pairs features and targets; `DataLoader` returns batches."
see = ["06-multiclass"]
source = "week04_nn/lab.md, Fourth rung: Dataset and DataLoader"
source_passage = """
`TensorDataset` bundles the features and targets into one object, giving us an interface to interact with them by index, the two arrays walked together instead of separately.

`DataLoader` then wraps the dataset and hands it over in batches: point it at `ds`, and looping over it yields one chunk of rows at a time.
"""
