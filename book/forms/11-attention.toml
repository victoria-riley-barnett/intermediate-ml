[[steps]]
claim = "The dot product gives a content-based score between two rows."
source = "week 11 lab, 2. Step one: relevance as a dot product"
figure = "eq-dot-product"
source_passage = """
Take a grid of six rows and eight columns. The score between two rows is their dot product, s_ij = x_i . x_j, which is large when two rows point the same way. Each row of scores is turned into shares by a softmax along that row, and the output row is the share-weighted average of all rows. A row whose scores are all similar spreads its shares evenly and returns something close to the plain mean; a row with one large score returns mostly that row.

There is nothing to train here. The shares are a function of the numbers that went in.

The wiring is visible without any training: editing row 3 changes which column row 0 attends to. The weakness is equally visible. The score is symmetric, s_ij = s_ji, so if row i finds row j relevant then row j finds row i equally relevant, and relevance is pinned to raw content similarity.
"""
text = """
Take a grid of six rows and eight columns. The score between two rows is their dot product, s_ij = x_i . x_j, which is large when two rows point the same way. Each row of scores is turned into shares by a softmax along that row, and the output row is the share-weighted average of all rows. A row whose scores are all similar spreads its shares evenly and returns something close to the plain mean; a row with one large score returns mostly that row.

