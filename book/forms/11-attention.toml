[[steps]]
claim = "The task depends on where the motifs sit, not which residues they contain."
source = "week 11 lab, 1. A task with two motifs"
source_passage = """
The alphabet is the twenty residues. Two triples are held back from the filler, `WWW` and `CCC`, so the filler draws only from the other eighteen. Each string is 48 positions long. One motif starts uniformly in 0..11, the other uniformly in 36..44, so one of them is early and the other late. The label is 1 when `WWW` comes first and 0 when `CCC` does.

Nothing about a single position decides the label. The residue counts are the same in both classes; only the arrangement differs. The generator returns integer ids in [0, 20) with shape (batch, 48) and labels with shape (batch,).
"""
