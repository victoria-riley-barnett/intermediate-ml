[[steps]]
claim = "Some questions have a rule; others have examples."
source = "week01_tensors/lecture.md, What machine learning is"
source_passage = """
Converting units, computing tax, checking a DNA string for a start codon. You can state those rules exactly. State them. A learned model would be slower, worse, and harder to debug.

Now write a rule for whether an email is spam. You can gesture at one, and every version you write has thousands of exceptions. But you have a hundred thousand emails that people already sorted.

**You cannot state the rule, but you have examples of it being followed.** That gap is the entire field.
"""
