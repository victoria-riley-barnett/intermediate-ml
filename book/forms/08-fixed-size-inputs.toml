[[steps]]
claim = "Padding carries length and position into the input."
see = ["12-encoder"]
source = "week 8 lecture, Padding gives a batch one shape"
source_passage = """
Strings of different lengths cannot be one array, so the shorter ones are filled up with a **pad** symbol until every string in the batch has the same length. Here that length is twelve.

The pad is a symbol like any other. It goes through the same weights as `S` and `T`, and it sits in a slot the model can see. How many pads a string carries, and where they sit, is therefore a fact the model can read: padding carries length and position, and a model does read it ([Islam, Jia & Bruce, 2020](https://arxiv.org/abs/2001.08248)). The same string padded on the other side is a different input, and for a model whose weights are tied to slot numbers it is as different as a different string.

The pads also have to be marked, so that a model can tell a real symbol from a pad. A **mask** is a second input, one flag per slot, marking which slots hold a real symbol.
"""
text = """
Strings of different lengths cannot be one array, so the shorter ones are filled up with a **pad** symbol until every string in the batch has the same length. Here that length is twelve.

