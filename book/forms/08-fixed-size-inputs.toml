The pads also have to be marked, so that a model can tell a real symbol from a pad. A **mask** is a second input, one flag per slot, marking which slots hold a real symbol.
"""
figure = "trace-padding-shifts"

[[steps]]
claim = "Five tests separate fitting, length, and position failures."
see = ["07-generalization"]
source = "week 8 lecture, Five tests for a model that reads strings"
source_passage = """
A test set built like the training set answers one question: does the model work on new examples of the kind it saw. It cannot show what happens when the length or the position changes, because those cases are not in it. The awkward cases are built by hand:

- **the training strings** — how well the model fits what it was shown; nothing about new data.
- **new strings, same lengths** — can it answer for strings it has never seen?
- **new strings, longer** — does what it learned hold at a length it never saw?
- **the same strings, padded on the left** — the symbols and their order are unchanged, every symbol sits in a different slot; does the answer depend on the symbols or on the slots?
- **the same strings, shifted one slot** — the smallest change of position there is.

Three models share the task and the 4,000 training strings: the flattened model, a counting model with the same 64 units, and a recurrent model (a GRU). The recurrent model reads the symbols one at a time and uses the mask to find the last real slot. A score is the share of a set that the model answers correctly. Each row is an average over 10 runs from different random starting points, and the spread across those runs appears beside the score in brackets.

The counting model scores about 0.50 on every column, which is where a model lands when it cannot tell the two answers apart. The flattened model is perfect on the two columns that use the lengths it trained on and lower on the two that move position, so what it learned does not travel. The recurrent model is perfect on longer strings, because its weights do not depend on the length, and it loses on both columns that move position.
"""
