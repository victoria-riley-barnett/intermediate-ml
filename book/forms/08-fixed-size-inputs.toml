[[steps]]
claim = "A wider window keeps local order but not distant pairs."
see = ["06-multiclass"]
source = "week 8 lecture, What the k-mer tally keeps, and what it costs"
source_passage = """
### What the k-mer tally keeps, and what it costs

A tally of wider windows is not order-blind. Counted in two-letter windows, `SxxT` gives `Sx`, `xx`, `xT` and `TxxS` gives `Tx`, `xx`, `xS`, so the tallies differ and a model can tell the reads apart. Each window holds a symbol together with its neighbour.

Position beyond the window is gone, and reaching a pair that sits far apart is what costs. A window has to be at least as long as the distance between the two symbols before it can hold them both: a read with twelve symbols between `S` and `T` needs windows of thirteen letters or more.

Four bases give $4^k$ possible windows — 256 at $k = 4$, 1,024 at $k = 5$, more than sixty-seven million at $k = 13$ — so a wider window carries more order and leaves far more of the tally at zero. A fixed window is a wager on how far apart the symbols that matter will be, and a task declares that distance only by asking its question.
"""
text = """
A [[06-multiclass|k-mer]] tally of wider windows is not order-blind. Counted in two-letter windows, `SxxT` gives `Sx`, `xx`, `xT` and `TxxS` gives `Tx`, `xx`, `xS`, so the tallies differ and a model can tell the reads apart. Each window holds a symbol together with its neighbour.

