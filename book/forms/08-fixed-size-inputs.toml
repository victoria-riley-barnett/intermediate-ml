[[steps]]
claim = "A count cannot distinguish two strings whose order gives opposite answers."
source = "week 8 lecture, What the input decides; The pair one representation cannot separate"
source_passage = """
A model's answer is a function of those numbers, so two examples that arrive as the same numbers get the same answer. Supply one example with each of the two answers and no learning procedure can satisfy both, because nothing left in the input tells them apart.

**Many to one.** A representation that sends two different examples to the same numbers is **many-to-one**, and the information it drops is gone before the model begins. This is the property to check first, and the check needs no training: name two examples the question treats differently, and ask whether the representation gives them the same numbers.
"""
