[[steps]]
claim = "A recurrent reader applies the same weights at every step."
see = ["10-whole-sequences", "11-attention"]
source = "week 8 lecture, Three ways to turn a string into numbers; Reading a list"
source_passage = """
**Recurrent.** The same twelve slots, read one after another. One small set of weights — the learned numbers that multiply the input — is updated at each step, and a sixty-four-number summary of everything read so far is carried forward.

**Carry a summary.** Keep a short list of numbers, the **hidden state**, update it at every step from the new symbol and the previous state, and predict from it. The same weights do the update at every step, so any length works. The price is a bottleneck: a fixed number of numbers stands in for everything read so far, however long the string was, and attention is the answer the field settled on.
"""
text = """
