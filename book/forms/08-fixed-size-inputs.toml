[[steps]]
claim = "Length flexibility does not guarantee position flexibility."
see = ["11-attention"]
source = "week 8 lecture, Position is part of the input"
source_passage = """
The recurrent model makes the same point from the other side, and it is the least stable row in the table. A longer string costs it nothing, and on the left-padded strings it averages 0.64 with a spread of 0.23 over ten runs from different starting points. A rate that moves that far between runs is not one behaviour: the symbols are identical in every run, and the pads are the only thing that moved. A model trained under a single padding convention handles the one it was taught and stumbles on the other. A spread nearly as wide as the distance from chance cannot carry more.
"""
