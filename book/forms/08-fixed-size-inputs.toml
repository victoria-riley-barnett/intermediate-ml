[[steps]]
claim = "The flattened reader guesses where training never put a symbol."
source = "week 8 lecture, Why the flattened model scores 0.78 on longer strings"
source_passage = """
That 0.78 averages two kinds of longer string. Training strings are 4 to 8 symbols padded on the right, so slots 9 to 12 only ever held pads, and what those weights learned is about pads rather than about symbols.

When both `S` and `T` of a longer string land in slots 1 to 8, the model answers a question it trained on and is right on essentially every one. When one lands further out, part of the answer comes from weights that never saw a symbol and the result is close to guessing. Of the longer strings, 57 per cent are the first case and 43 per cent the second, which is how the two combine into 0.78.

Training longer does not change it: from 200 strings to 4,000 the score moves from about 0.71 to about 0.79. No string of length 4 to 8 puts a symbol in slot 11. What is missing is not data but an input that does not fix the length in advance. The weights of each slot can be read one number at a time, and the four that never held a symbol keep the values they started from — 1.4 against 2.7 on the same scale — which is the arithmetic behind the failure.
"""
