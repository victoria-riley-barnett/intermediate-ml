[frame]   # the course's own frame: representation -> transformation -> evidence
data = "4,380 human gene sequences in seven gene families, with 1,682 chimp and 820 dog sequences from other species."
representation = "k-mer counts: one column per possible window of k bases, 4^k columns"
transformation = "z = xW + b, seven logits; q = softmax(z); L = -log q_c"
evidence = "cross-entropy while training; held-out accuracy against naming the largest family for every gene"
