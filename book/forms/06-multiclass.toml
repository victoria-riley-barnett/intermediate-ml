# Chapter form. Every prose field is mined from the delivered course, with its
# source; nothing here is new narrative. See book/FORM.md.

number = "6"
title = "Multiclass and softmax"
gist = "k-mers, logits, softmax and cross-entropy, on genes."

[timeline]
row = "The feed-forward network ends in a softmax over its scores."
plate = "feedforward"

[frame]   # the course's own frame: representation -> transformation -> evidence
data = "4,380 human gene sequences in seven gene families, with 1,682 chimp and 820 dog sequences from other species."
representation = "k-mer counts: one column per possible window of k bases, 4^k columns"
transformation = "z = xW + b, seven logits; q = softmax(z); L = -log q_c"
evidence = "cross-entropy while training; held-out accuracy against naming the largest family for every gene"
source = "411/curriculum.toml week06, corrected by admin/BOOK.md (k = 6 in the lab, 4,096 columns) and gene_family_data/ row counts"

[[steps]]
claim = "A class is a name, not a quantity, so the model holds one score per class."
see = ["05-evaluation", "04-neural-networks"]

[[steps]]
claim = "Counting k-letter windows turns a gene of any length into a fixed-length vector."
see = ["08-fixed-size-inputs", "09-embeddings"]
figure = "trace-kmer-gene"

[[steps]]
claim = "One column of weights per family gives one score, a logit, per family."

[[steps]]
claim = "The decision is an argmax, and training cannot follow it."
see = ["02-autodifferentiation#3"]

[[steps]]
claim = "Softmax exponentiates the scores, then divides by their total."
figure = "eq-softmax"

[[steps]]
claim = "With a one-hot truth, cross-entropy reads one bar: the probability on the right family."
figure = "eq-cross-entropy"

[[steps]]
claim = "The loss is a mismatch between distributions, not a distance between numbers."
see = ["fig:eq-mse", "02-autodifferentiation#7"]

[[steps]]
claim = "The gradient is the distribution minus the truth."
see = ["02-autodifferentiation#8", "03-backpropagation", "07-generalization"]

[[code]]
label = "Count k-mers, then turn seven scores into a loss"
file = "06-multiclass/kmer_softmax.py"
credit = "Softmax and loss adapted from SmolML smolml/utils/activation and smolml/utils/losses (MIT); the k-mer counter is ours"

[next]
missing = "Whether an accuracy on held-out genes can be trusted."
chapter = "07-generalization"
