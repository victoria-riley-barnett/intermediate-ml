[[steps]]
claim = "Related rows on both sides of a split can flatter its score."
see = ["06-multiclass"]
figure = "split-homology-leakage"
source = "411/weeks/week07_generalization/lecture.md, What “new” means"
source_passage = """
The failure has a name. **Data leakage** is any route by which information about held-out examples reaches the model before the held-out score is computed. Three common routes:

- **Preprocessing on everything.** A mean, standard deviation, feature selection rule or vocabulary computed from all data before the split has already seen the held-out examples. Fit it on training data only, then apply it unchanged.
- **Related samples on both sides.** With five blood samples from each of twenty patients, a random split by sample lets the model recognize the patient instead of the disease. Split by patient. Technical replicates are near-copies for the same reason.
- **Exact duplicates.** Public databases hold identical entries, so a “new” test example may have a twin in training. That measures memory, not prediction.

No software warns you about any of these. Leakage never raises an error; it only makes the result look better than it is. So before splitting, name the unit you want to generalize across (patient, species, lab, sequencing run) and check that all of that unit's samples sit on one side.
"""
