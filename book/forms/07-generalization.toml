[[steps]]
claim = "Overfitting is a trend, not just a gap between losses."
figure = "plot-curves"
source = "411/weeks/week07_generalization/lecture.md, Learning curves show the useful part of training"
source_passage = """
With the split in place we can watch a model learn and see, as it happens, whether it is learning the pattern or the noise. One pass through the training data is an **epoch**. After each epoch we measure the **loss**, a single number that is large when predictions are bad and small when they are good (for classification, cross-entropy). We measure it on both the training set and the validation set:

Plotting the two losses against epoch gives a **learning curve**. Three shapes cover most of what you will see:

1. **Underfitting** (left): both losses stay high and barely move. The model, or the training, has not captured the pattern.
2. **Learning** (middle): both losses fall together, so what the model learns from the training data also helps on new data.
3. **Overfitting** (right): training loss keeps falling, but validation loss bottoms out and climbs. The model is getting better at the training examples and worse at the task.

In every panel validation loss sits above training loss, and that is normal: the parameters were adjusted on the training data, never on the validation data. So a gap by itself is not overfitting. Overfitting is the trend in the right panel, where the validation curve turns upward while the training curve keeps going down.

Training loss falls toward zero, as in the overfitting panel. Validation loss reaches its lowest value, 0.62, at epoch 10 and climbs back to 0.87 by epoch 60. Accuracy tells a different story: 0.86 near epoch 10 and 0.88 at epoch 60, so the network keeps naming more genes correctly even as its loss rises. The reason is that loss punishes a wrong answer in proportion to how confident it was. When the network is wrong it is on average 84% sure at epoch 60, against 66% near epoch 10.

So which epoch to keep depends on what you will use the network for. If you only need the family name, accuracy is still improving at epoch 60. If you will act on how sure the network is, the epoch with the lowest loss is better. Decide before you look at the test set, and write the choice down.
"""
