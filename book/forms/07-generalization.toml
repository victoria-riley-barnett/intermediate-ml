[[steps]]
claim = "Training, validation, and test each have a separate job."
see = ["05-evaluation"]
source = "411/weeks/week07_generalization/lecture.md, The split gives each set one job"
source_passage = """
The extra standard at concentration 5 was measured after the fit. For a real model we set such examples aside before training. We need examples with known answers that the model never uses to adjust its parameters. These are **held-out** examples. We keep two held-out sets rather than one, because they have different jobs:

| set | changes the weights? | used to make choices? | purpose |
|---|---|---|---|
| training | yes | indirectly | fit the model |
| validation | no | yes | choose settings and the stopping point |
| test | no | no, until the end | report the finished choice |

The validation set is not a second training set. It is the one we look at while working, to decide among models, epoch counts, learning rates or penalties. Because every choice is made by looking at it, a validation score after many choices is slightly flattering.

The test set is scored once, after every choice is made. If the result disappoints and you change the model, those examples have become validation data and you need a fresh test. A chemist validating an assay does the same: tune the cutoff on development samples, then run the blinded samples once.

**In the gene data.** The 4,380 genes are cut into 2,628 for training, 876 for validation and 876 for test, keeping each family's share the same in all three. From here on the validation genes are the ones we look at, and the test genes stay sealed until the end.
"""
