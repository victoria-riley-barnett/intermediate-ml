[[steps]]
claim = "A test score describes the examples it resembles."
see = ["08-fixed-size-inputs"]
source = "411/weeks/week07_generalization/lecture.md, What “new” means"
source_passage = """
**In the gene data.** We checked our own split for the third route. The file has 4,380 rows but only 3,629 different sequences, so some validation genes must have an identical copy among the training genes. We split the validation genes into those with a twin and those without, and scored each group.

207 of the 876 validation genes have a twin in training, and the network names all of them correctly. On the other 669 it is right 84% of the time. The 0.88 over all validation genes is a mixture of the two, so 0.84 is the better answer to “how well does the network name a gene it has never seen?” The check itself is two lines:

```python
seen = set(sequences[i] for i in train_index)
has_twin = [sequences[i] in seen for i in val_index]
```

The test set needs the same check. 169 of the 876 test genes have a training twin, and on the other 707 the network is right about 84% of the time. That is the number to report for an unseen gene, and it is still a little generous, because near-copies that are not identical may remain.

This is also why a held-out score is never a claim about everything. It estimates performance on data like the held-out data: if the test genes come from the same database as the training genes, a high score says nothing about another lab's instrument or another population. So state the question exactly: generalize from what kind of examples to what kind of new examples?
"""
