[[steps]]
claim = "A model can fit its training examples and still miss the pattern."
source = "411/weeks/week07_generalization/lecture.md, A model can fit without learning the pattern"
source_passage = """
Start with a case small enough to check by hand. Four calibration standards give these readings:

| concentration | 1 | 2 | 3 | 4 |
|---|---|---|---|---|
| measured response | 0.11 | 0.19 | 0.32 | 0.38 |

We fit two curves to them and ask which one to trust. The first is a straight line. The second is a cubic, a curve of the form $y = a + bx + cx^2 + dx^3$. Its four adjustable constants are exactly enough to pass through four points, so it can hit every standard. The line has only two constants and misses each standard slightly, by about 0.001, −0.013, 0.023 and −0.011. The cubic misses by nothing. If we score each curve by its error on these four standards, the cubic wins.

But a calibration curve exists to predict samples we have not measured yet. So measure one more: a new standard at concentration 5 reads 0.48. The line predicts about 0.485, very close. The cubic, carried one step further, predicts 0.25, off by nearly half the signal. The curve that fit the standards best was the worst at the job we wanted it for.

Why did the cubic fail? Each reading is the true response plus a small random error from the instrument, which we call **noise**. The true response rises steadily with concentration. The errors do not follow any pattern, and they would be different if we measured again. The line has too little freedom to chase the errors, so it keeps only the steady rise. The cubic has enough freedom to bend through the errors, so it records them as if they were part of the curve, and beyond the last standard those errors carry it far from the truth.

Fitting the accidents of one sample as if they were the pattern is **overfitting**. The opposite failure is **underfitting**: a model too limited, or trained too briefly, to capture the pattern even in the data it was fitted to. The line would underfit if the true response curved.

A neural network is a fitted curve with many more adjustable constants. They are called **parameters** (in a network, the weights), and training adjusts them to reduce error on the training data, which is what the cubic did with its four. That is why error on the training data cannot tell you whether a model learned the pattern or the noise. To find out, you need examples the model was not fitted to. The ability to predict those well is **generalization**.

This does not mean a simpler model always wins. Very large networks can generalize well. What the example does establish is narrower: how well a model fits the examples it was fitted to says little about how it will do on the next one, so the next one has to be measured. The next section sets that up.
"""
