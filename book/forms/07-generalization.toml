[[steps]]
claim = "Dropout's gain must exceed the variation between random seeds."
see = ["architectures"]
figure = "compare-regularizers"
source = "411/weeks/week07_generalization/lecture.md, Reducing overfitting, briefly"
source_passage = """
**Dropout** switches off a random fraction of the units in a layer on every training step. A unit is one small computing element that outputs a number, and switching it off means forcing that output to zero for that step. Because any unit may vanish, the network cannot rely on one unit to carry a quirk of the training data. Dropout is noise added during training only. It is not a gene knockout, which is a fixed change to a living system that you then study.

At evaluation time dropout must be off, so you call `model.eval()` before scoring. A quick check: score the same trained model twice on the same data. The two numbers must match exactly. If they do not, dropout is still on.

Whether dropout helped is again a question for the validation set, and the answer has to be bigger than run-to-run variation. Training starts from random values, so two runs that differ only in their random seed give slightly different results: our five plain runs reach lowest validation losses between 0.609 and 0.628. A difference smaller than that spread is not evidence.
"""
