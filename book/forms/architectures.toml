# Chapter form. Text passages are copied from the plate descriptions.

number = "⌂"
title = "Architectures, and where each one came from"
gist = "Each era changes either the block or the input; 2017 to 2022 changes both."

[frame]
data = "one grid, sequence or protein, drawn small enough to check by hand"
representation = "the block (what the weights are) and the input (what the first layer is handed)"
transformation = "one architecture per plate"
evidence = "each plate's shapes agree with its code"
source = "Architectures brief; course frame in 411/curriculum.toml, corrected by 411/admin/BOOK.md"

[[steps]]
claim = "The block changes from counted units to trainable networks."
chapter = "01-linear-analysis"
see = ["02-autodifferentiation"]
figure = "lineage-a-1943-1997"
source = "book/figures/lineage-a-1943-1997.html, <desc>"
source_passage = """Seven eras in two epochs. The first epoch studies one unit and its proven limit; the second studies a network that can be trained: error pushed back layer by layer, one filter reused at every position, a cell state carried forward by addition. Every row sits on the same grid, so a mark that comes back keeps its shape and its place. Continues in part two, 2012–2022."""
text = """Seven eras in two epochs. The first epoch studies one unit and its proven limit; the second studies a network that can be trained: error pushed back layer by layer, one filter reused at every position, a cell state carried forward by addition. Every row sits on the same grid, so a mark that comes back keeps its shape and its place. Continues in part two, 2012–2022."""

[[steps]]
claim = "The block waits while data and compute change around it."
chapter = "05-evaluation"
figure = "quiet-years"
source = "book/figures/quiet-years.html, <desc>"
source_passage = """Three timelines from 1994 to 2012. The architecture lane runs from LSTM in 1997 to AlexNet in 2012 with a single hollow mark at pretraining in 2006, too small to scale, and nothing else for fifteen years. A second lane gives what the field taught instead: support vector machines in 1995, boosting in 1997 and random forests in 2001, all resting on hand-built features followed by a simple model. A third lane gives what arrived from elsewhere: CUDA in 2007, on hardware that video games funded, and ImageNet in 2009, crowdsourced. All three lanes meet at 2012, where the top five error was 15.3 percent against a next best of 26.2 percent."""
text = """Three timelines from 1994 to 2012. The architecture lane runs from LSTM in 1997 to AlexNet in 2012 with a single hollow mark at pretraining in 2006, too small to scale, and nothing else for fifteen years. A second lane gives what the field taught instead: support vector machines in 1995, boosting in 1997 and random forests in 2001, all resting on hand-built features followed by a simple model. A third lane gives what arrived from elsewhere: CUDA in 2007, on hardware that video games funded, and ImageNet in 2009, crowdsourced. All three lanes meet at 2012, where the top five error was 15.3 percent against a next best of 26.2 percent."""

[[steps]]
claim = "The block changes, then the input changes, then compute and tuning."
chapter = "07-generalization"
figure = "lineage-b-2012-2022"
source = "book/figures/lineage-b-2012-2022.html, <desc>"
source_passage = """Nine eras in two epochs. The same blocks are trained on far more data and compute, then carried across domains — vision, language, translation, and at last protein structure, where the input changes before the block does; after that what changes is where the compute budget goes, then whose answers the model is tuned toward. Four open directions follow the last row, named but not drawn, because no single mechanism orders them yet. Continues part one, 1943–1997."""
