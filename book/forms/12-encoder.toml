[[steps]]
claim = "Position vectors preserve sequence order until the final mean pooling."
see = ["06-multiclass"]
source = "week12_encoder lab.md, 4. The encoder"
source_passage = """
The encoder turns ids into vectors, adds a learned position vector to each, runs the blocks, averages over the 48 positions, and applies one linear layer to two scores. Mean pooling is deliberately blunt: it discards order at the last moment, which forces the blocks to encode the answer somewhere in the vectors before pooling happens.

Every row of that printout is `(4, 48, 32)` from the embedding through the last block. The block maps `(B, 48, 32)` to `(B, 48, 32)`; the only shape changes are at the entry, where ids become vectors, and at the exit, where positions collapse to a single vector per sequence.
"""
