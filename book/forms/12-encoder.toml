[[steps]]
claim = "The labels depend on motif order, not the letters present."
source = "week12_encoder lab.md, 1. The data"
source_passage = """
Every sequence is 48 residues long, drawn from a twenty-letter alphabet. Two three-letter motifs sit in it: `WWW` and `CCC`. Filler positions never contain `W` or `C`, so the only `W`s and `C`s in a string are the motifs themselves. One motif starts somewhere in positions 0 to 11, the other starts somewhere in 36 to 44, so the two never touch. Which motif is placed first is the label: 1 when `WWW` comes first, 0 when `CCC` does.

Both motifs are present in every sequence. Nothing about which letters occur separates the classes; only their order does.
"""
