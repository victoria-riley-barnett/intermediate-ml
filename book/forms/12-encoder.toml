[[steps]]
claim = "The attention map proposes a place to look; ablation decides whether it matters."
see = ["05-evaluation"]
source = "week12_encoder lab.md, 6. Measure the map"
source_passage = """
Any number above the baseline is a claim about this head on these sequences. The control is to keep the head and move the mask: score the attention of sequence `n` against the motif positions of sequence `n+1`. If the effect is real, it should not survive that substitution.

Remember what these numbers are not. Attention weight is not contribution: a head can put weight on a column and the value it carries can still be ignored downstream. So the decisive test is an ablation, not a picture — zero the motif positions in the input, or average the attention of a head across the batch and see whether the score moves. The measurement narrows the search; it does not settle it.
"""
