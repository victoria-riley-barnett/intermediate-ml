[[steps]]
claim = "Pre-norm keeps the identity route untouched and preserves the block shape."
see = ["architectures"]
figure = "encoder-block"
source = "week12_encoder lab.md, 3. One block"
source_passage = """
The order is pre-norm, with the normalisation inside the residual branch: `x = x + attn(norm1(x))`, then `x = x + ffn(norm2(x))`.

Three checks matter. The output shape equals the input shape, `(4, 48, 32)`, which is what lets blocks be stacked at all. Every attention row sums to one, so the softmax did what it claims. And the relative change tells us how far an untrained block moves its input: with a residual the block only has to supply a correction, so the ratio stays modest even though the branch itself is arbitrary.
"""
