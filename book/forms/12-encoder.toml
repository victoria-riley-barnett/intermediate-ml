[[steps]]
claim = "A residual connection leaves a derivative-one path through a stack."
see = ["02-autodifferentiation"]
figure = "eq-residual"
source = "week12_encoder lecture.md, Three things attention cannot do alone"
source_passage = """
The first failure is depth itself. Each block is a nonlinear map, and a stack of them can only carry information forward by re-encoding it through another set of weights at every stage. Small distortions introduced by one block are fed into the next and amplified, so the composition of many blocks drifts away from the input even when no transformation is wanted. Backpropagation shows the same problem from the other side: the gradient at the first block is the product of one Jacobian per block, and if those matrices shrink vectors on average, the product shrinks exponentially. A residual connection changes the block to `y = x + F(x)`. The Jacobian becomes `I + dF/dx`, and the identity term guarantees a path from output to input with derivative exactly one, independent of depth and independent of what `F` has learned. The gradient arrives undiminished, and `F` only has to learn a correction to the identity rather than a full re-encoding of the representation. Both signal and gradient get a route that the weights cannot degrade.
"""
text = """
The first failure is depth itself. Each block is a nonlinear map, and a stack of them can only carry information forward by re-encoding it through another set of weights at every stage. Small distortions introduced by one block are fed into the next and amplified, so the composition of many blocks drifts away from the input even when no transformation is wanted. [[02-autodifferentiation|Backpropagation]] shows the same problem from the other side: the gradient at the first block is the product of one Jacobian per block, and if those matrices shrink vectors on average, the product shrinks exponentially. A residual connection changes the block to `y = x + F(x)`. The Jacobian becomes `I + dF/dx`, and the identity term guarantees a path from output to input with derivative exactly one, independent of depth and independent of what `F` has learned. The gradient arrives undiminished, and `F` only has to learn a correction to the identity rather than a full re-encoding of the representation. Both signal and gradient get a route that the weights cannot degrade.
"""

