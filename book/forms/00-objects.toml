"""

[[steps]]
claim = "A model's capacity sets the patterns it can represent."
source = "week00_oop/lecture.md, Model: what can it even express?"
source_passage = """
A model that just counts trigger words ("free," "winner," "act now") expresses one thing well: spam that's blunt about being spam. It's structurally blind to spam that avoids those words, spam that's mostly an image, and context. A real marketing email from a company you use trips the same words as a scam.

This ceiling, the range of patterns a model is even capable of representing regardless of how much data you give it, is its **capacity**. A more flexible model has more capacity, expresses subtler patterns, and costs more: more data to fit well, more room to memorize noise instead of signal, harder to inspect afterward.
"""
