[[steps]]
claim = "The data can be incomplete, and it can leak the answer."
source = "week00_oop/lecture.md, Data: a spam filter"
source_passage = """
A pile of past emails, each labeled "spam" or "not spam" by a person. From each you pull **features**, measurable properties: trigger words in the subject, exclamation-point count, an unfamiliar sender domain.

**What's missing?** If labels only came from users who clicked "report spam," you're missing all the spam nobody reported.

**What would leak?** A feature like "was this moved to the Spam folder" isn't a feature, it's the answer smuggled back in. A model trained on it looks perfect and is useless the moment it has to predict on an unsorted email. This failure mode has a name, **leakage**, and it's worth checking for every time a model looks suspiciously good.
"""
text = """
