[[steps]]
claim = "A method acts on the state held by the object before the dot."
source = "week00_oop/lecture.md, Reading the dot"
source_passage = """
`object.method()` reads as a sentence: *"object, do method to your own data."* `acct.deposit(50)` becomes "account, deposit 50 into yourself." `df.dropna()` becomes "table, drop your own missing rows."

The object before the dot supplies the state; the method after acts on exactly that state. Nothing magic: Python finds the class, calls its method, passes the object in automatically.
"""
