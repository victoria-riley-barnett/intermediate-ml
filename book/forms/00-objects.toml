[[steps]]
claim = "A model is a function whose behavior comes from data."
source = "week00_oop/lecture.md, Why reach for a learned model at all"
source_passage = """
A **model**, in this course, means: a function you don't hand-write. Input goes in, a prediction comes out, and its exact behavior comes from data instead of a rule you typed yourself.
"""
text = """
A **model**, in this course, means: a function you don't hand-write. Input goes in, a prediction comes out, and its exact behavior comes from data instead of a rule you typed yourself.
"""
see = ["02-autodifferentiation"]

[[steps]]
claim = "Use machine learning when the rule cannot be written but examples can be labeled."
source = "week00_oop/lecture.md, Why reach for a learned model at all, continued; A rule you genuinely cannot write down"
source_passage = """
**The ML way:** show a model years of examples, each day's conditions paired with what tomorrow's weather actually turned out to be, and let it find, on its own, whatever relationship connects the two. You never write the rule down. That pairing, an example plus the correct answer attached to it, is a **label**; a pile of examples that each carry one is **labeled data**.

**The dividing line:** reach for ML when you can't write down the rule, but you can supply a lot of labeled examples of the rule being followed.

Try writing a step-by-step, exception-free procedure for telling a cat photo from a dog photo, using raw pixels. Not "cats are smaller," some dogs are tiny. Not "pointy ears," so do some dogs.

You can't do it. Nobody can. The knowledge that lets *you* recognize a cat lives somewhere you don't have conscious access to.

But you can hand ten thousand labeled photos to a model and let it find the pattern a hand-written rule never could.
"""
