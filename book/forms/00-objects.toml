[[steps]]
claim = "Overall accuracy can hide the mistakes that matter."
source = "week00_oop/lecture.md, Evaluate: did it work, for whom?"
source_passage = """
Naive check: overall accuracy. If spam is 20% of all mail, labeling *everything* "not spam" is already 80% accurate, and catches nothing.

Ask *for whom* it worked: a real email wrongly buried in spam (a **false positive**, which intro stats calls a Type I error) is a far more expensive mistake than one spam message that slips through (a **false negative**, Type II). Where did it fail, a language it was never shown, a spam style it's never seen? What's next follows from the answer.
"""
