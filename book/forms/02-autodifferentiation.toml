The second job is less obvious. Squaring does not treat all errors proportionally. An error of -1 squares to 1, an error of +2 to 4, and an error of -3 to 9.

The third error is three times the size of the first and contributes nine times as much to the loss. That is not a flaw. It follows directly from squaring, and it is what the tool does. It does have a consequence you should expect: a model fitted with squared error will move its line to reduce one very large miss, even when that makes every other point slightly worse.
"""

[[steps]]
claim = "Every point on the loss curve is a whole model."
source = "week02_autodifferentiation/lab.md, The loss as a function of the weight"
source_passage = '''
The curve falls, reaches a minimum near `w = 3.0`, and rises again.

The horizontal axis deserves a second look, because it is not the kind of quantity plots usually put there. It is not a measurement of anything in the world. It is a parameter, a number we choose. Every point on this curve represents an entire model, one particular choice of `w`, scored against all forty data points at once. Moving to the right along the axis does not mean looking at a different sample. It means considering a different model.

The shape tells us the problem is solvable. There is a lowest point, and the whole task is to find it.
'''
