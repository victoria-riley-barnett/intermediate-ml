# Chapter form: an ordered list of atoms (book/atoms/02-autodifferentiation.toml),
# grouped into paragraphs under the course frame (representation, transformation,
# evidence), with plates, small multiples, code and named glue slots.
# Glue is the author's to write; it stays empty until she does.

number = "2"
title = "Autodifferentiation"
gist = "Loss, direction, the update, learning rate; mean squared versus mean absolute error."

[timeline]
row = "1958: a weight moves by the error times that weight's own input."
plate = "lineage-a-1943-1997"

[frame]
question = "What did the model learn from this representation, and what evidence supports that claim?"
data = "Points on y = 3x + 7, so the right answer is known."
representation = "parameters, predictions, errors, and loss"
transformation = "w <- w - lr * dloss/dw, repeated"
evidence = "loss decreases for the right reason and gradients agree"

[[glue]]
name = "opening"
after = ""
text = ""

[[section]]
name = "representation"

[[section.para]]
atoms = ["ch2.loss", "ch2.mse", "ch2.signs-cancel", "ch2.squares-grow", "ch2.big-miss"]

[[section.para]]
atoms = ["ch2.mse-worked", "ch2.mse-run", "ch2.bottom-at-3", "ch2.point-is-model", "ch2.scan-cost"]
figures = ["eq-mse"]

[[glue]]
name = "representation-to-transformation"
after = "ch2.scan-cost"
text = ""

[[section]]
name = "transformation"

[[section.para]]
atoms = ["ch2.derivative", "ch2.sign-orders", "ch2.slope-sum", "ch2.slope-check", "ch2.gradient"]

[[section.para]]
atoms = ["ch2.update-rule", "ch2.one-step", "ch2.one-step-check", "ch2.gradient-descent", "ch2.walk-shrinks", "ch2.walk-check"]
figures = ["gradient-descent"]

[[section.para]]
atoms = ["ch2.loop-halves", "ch2.loop-run", "ch2.converging"]
figures = ["loop-gradient-descent"]

[[section.para]]
atoms = ["ch2.grad-adds", "ch2.forgot-zero", "ch2.no-grad"]
multiples = ["cleared-grad"]
figures = ["code-gd"]

[[glue]]
name = "transformation-to-evidence"
after = "ch2.no-grad"
text = ""

[[section]]
name = "evidence"

[[section.para]]
atoms = ["ch2.learning-rate", "ch2.overshoot", "ch2.lr-large", "ch2.lr-small", "ch2.lr-no-formula"]
multiples = ["learning-rates"]

[[section.para]]
atoms = ["ch2.mae", "ch2.mean-median", "ch2.big-miss-costs", "ch2.loss-is-a-choice"]
multiples = ["mean-median"]

[[section.para]]
atoms = ["ch2.weight-gradient", "ch2.zero-input", "ch2.scale"]
figures = ["eq-weight-gradient"]

[[glue]]
name = "closing"
after = "ch2.scale"
text = ""

[questions]
atoms = ["ch2.q-what-changes", "ch2.q-negative-grad", "ch2.q-still-falling", "ch2.q-outlier"]

[[code]]
label = "One step by hand, in pure Python"
file = "02-autodifferentiation/one_step.py"
credit = "Adapted from SmolML core/value.py, utils/losses, utils/optimizers (MIT)"

[[code]]
label = "The loop, three learning rates, and a loop that forgets to clear .grad"
file = "02-autodifferentiation/loop.py"

[[code]]
label = "Mean or median: what each loss chooses"
file = "02-autodifferentiation/mean_median.py"

[next]
missing = "A derivative for anything deeper than one layer."
chapter = "03-backpropagation"
