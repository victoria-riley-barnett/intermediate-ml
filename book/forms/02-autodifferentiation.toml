# Chapter form: an ordered list of atoms (book/atoms/02-autodifferentiation.toml),
# section titles taken from the delivered lab's headings, plates, code, and named
# glue slots. Glue is the author's to write; it stays empty until she does.

number = "2"
title = "Autodifferentiation"
gist = "Loss, direction, the update, learning rate; mean squared versus mean absolute error."

[timeline]
row = "1958: a weight moves by the error times that weight's own input."
plate = "lineage-a-1943-1997"

[frame]
data = "Points on y = 3x + 7, so the right answer is known."
representation = "parameters, predictions, errors, and loss"
transformation = "w <- w - lr * dloss/dw, repeated"
evidence = "loss decreases for the right reason and gradients agree"

[[glue]]
name = "opening"
after = ""
text = ""

[[section]]
title = "What the loss measures"
atoms = ["ch2.loss", "ch2.mse", "ch2.signs-cancel", "ch2.squares-grow", "ch2.big-miss", "ch2.mse-worked", "ch2.mse-run"]
figures = ["eq-mse"]

[[glue]]
name = "loss-to-curve"
after = "ch2.mse-run"
text = ""

[[section]]
title = "The loss as a function of the weight"
atoms = ["ch2.point-is-model", "ch2.bottom-at-3", "ch2.scan-cost"]

[[section]]
title = "Finding the direction"
atoms = ["ch2.derivative", "ch2.gradient", "ch2.sign-orders", "ch2.slope-sum", "ch2.slope-check"]

[[glue]]
name = "direction-to-step"
after = "ch2.slope-check"
text = ""

[[section]]
title = "One step, and then many"
atoms = ["ch2.update-rule", "ch2.one-step", "ch2.one-step-check", "ch2.gradient-descent", "ch2.walk-shrinks", "ch2.walk-check", "ch2.loop-halves", "ch2.loop-run", "ch2.converging", "ch2.grad-adds", "ch2.forgot-zero", "ch2.no-grad"]
figures = ["gradient-descent", "loop-gradient-descent", "code-gd"]

[[section]]
title = "The learning rate"
atoms = ["ch2.learning-rate", "ch2.overshoot", "ch2.lr-large", "ch2.lr-small", "ch2.lr-no-formula"]

[[glue]]
name = "rate-to-loss-choice"
after = "ch2.lr-no-formula"
text = ""

[[section]]
title = "Choosing a loss"
atoms = ["ch2.mae", "ch2.mean-median", "ch2.big-miss-costs", "ch2.loss-is-a-choice"]

[[section]]
title = "The same loop on real measurements"
atoms = ["ch2.weight-gradient", "ch2.zero-input", "ch2.scale"]
figures = ["eq-weight-gradient"]

[[glue]]
name = "closing"
after = "ch2.scale"
text = ""

[[section]]
title = "Questions"
atoms = ["ch2.q-what-changes", "ch2.q-negative-grad", "ch2.q-still-falling", "ch2.q-outlier"]

[[code]]
label = "One step by hand, in pure Python"
file = "02-autodifferentiation/one_step.py"
credit = "Adapted from SmolML core/value.py, utils/losses, utils/optimizers (MIT)"

[[code]]
label = "The loop, three learning rates, and a loop that forgets to clear .grad"
file = "02-autodifferentiation/loop.py"

[[code]]
label = "Mean or median: what each loss chooses"
file = "02-autodifferentiation/mean_median.py"

[next]
missing = "A derivative for anything deeper than one layer."
chapter = "03-backpropagation"
