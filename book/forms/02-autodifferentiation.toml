[[steps]]
claim = "The loss turns forty errors into one number."
source = "week02_autodifferentiation/lab.md, What the loss measures"
figure = "eq-mse"
source_passage = '''
A model that makes a prediction for every data point also makes an error for every data point. With forty points, that is forty separate numbers describing how wrong the model is. Forty numbers are hard to compare against another forty and impossible to search with, so they have to be reduced to one. That single number is the **loss**, and the convention is that smaller means better.

The recipe has three steps. Take the error at each point, which is the prediction minus the truth. Square it. Average the squares.

$$\text{MSE} = \text{mean}\left(\left(\hat{y} - y\right)^2\right)$$

The squaring does two separate jobs, and it is worth separating them.

The first job is to remove the signs. An error of +2 and an error of -2 are equally wrong, but averaging them directly would let them cancel and report no error at all. The flat line through the average penguin mass did exactly that: it was wrong about nearly every bird and still scored close to zero, because its overestimates and underestimates destroyed each other. Squaring makes every error positive, so they can only accumulate.

The second job is less obvious. Squaring does not treat all errors proportionally.

| error | squared |
|---|---|
| -1 | 1 |
| +2 | 4 |
| -3 | 9 |

The third error is three times the size of the first and contributes nine times as much to the loss. That is not a flaw. It follows directly from squaring, and it is what the tool does. It does have a consequence you should expect: a model fitted with squared error will move its line to reduce one very large miss, even when that makes every other point slightly worse.
'''
text = """
A model that makes a prediction for every data point also makes an error for every data point. With forty points, that is forty separate numbers describing how wrong the model is. Forty numbers are hard to compare against another forty and impossible to search with, so they have to be reduced to one. That single number is the **loss**, and the convention is that smaller means better.

The loss used here is mean squared error. The recipe has three steps. Take the error at each point, which is the prediction minus the truth. Square it. Average the squares.

