[[steps]]
claim = "Held-out rows show how a model behaves on data it has never seen."
see = ["07-generalization"]
source = "week 5 lab, Splitting the rows: 250 to learn from, 750 held back"
source_passage = """
The first 250 rows train the model. The remaining 750 are kept out of training entirely, and every number you report later comes from them.

Slicing is how you split: `X[:n_train]` means the first 250 rows, `X[n_train:]` means everything from row 250 onward. Both classes stay in roughly the same proportion, which is what you want. Those 750 rows are the only ones that can tell you how the model behaves on data it has never seen, which is the question every number is trying to answer.
"""
