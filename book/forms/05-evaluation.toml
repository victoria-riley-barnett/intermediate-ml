[[steps]]
claim = "A metric's denominator tells you which rows it describes."
see = ["02-autodifferentiation"]
source = "week 5 lab, report(): accuracy_score, recall_score, precision_score"
source_passage = """
The three metrics answer three different questions, and the quickest way to keep them apart is to read the denominator first, because the denominator is what the question is about:

| metric | the question | the arithmetic |
|---|---|---|
| **accuracy** | of all the rows, how many did it get right? | `(TP + TN) / everything` |
| **recall** | of the rows that really are 1s, how many did it find? | `TP / (TP + FN)` |
| **precision** | of the rows it called 1s, how many really are? | `TP / (TP + FP)` |

Accuracy weighs all four cells equally. Recall and precision do not, which is why they disagree with it whenever the classes are not equally common or the two errors are not equally costly.
"""
