[[steps]]
claim = "Choosing a cutoff trades one kind of error for the other."
source = "week 5 lab, The cutoff, and which error you would rather make"
source_passage = """
The model outputs a probability. The 0.5 that turns it into a decision is a choice.

Think about what 0.5 assumes: that the two mistakes are equally bad. Calling a 0 a 1, and calling a 1 a 0. For many real problems that is false. If this were a screening tool and a missed 1 were the expensive error, you would lower the cutoff, so that a row only has to look somewhat like a 1 to be called one. Recall would rise, because you would catch more of the 1s. Precision would fall, because some of the rows you now call 1s really are 0s. Moving the cutoff trades one of those errors for the other, and which way to trade is a decision about the problem rather than about the model.
"""
