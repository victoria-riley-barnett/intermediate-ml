[[steps]]
claim = "Accuracy can be high when a rule ignores every minority class."
see = ["06-multiclass"]
source = "week 5 lecture, Accuracy can be high while the model is useless; Every number needs a baseline"
source_passage = """
Most screening data is unbalanced: far more healthy rows than sick ones. So consider a model that answers "healthy" to everything.

| accuracy | recall |
|---|---|
| $2/3 = 0.667$ | $0/1 = 0.000$ |

Two thirds right, and it finds nobody. **A test that misses the sick is not rescued by being right about the healthy.**

A **baseline** is the score of the simplest model that could possibly work, measured on the same data with the same metric. It is the number your model has to beat before it has done anything at all.

For a screening problem the simplest model is usually "call everyone healthy."

| on the ten-row example | accuracy | recall |
|---|---|---|
| the simplest guess | $2/3 = 0.667$ | $0/1 = 0.000$ |

High accuracy, no use. So accuracy is the wrong baseline for this problem, and the number to report beside a recall is the recall of the simplest model that finds anybody at all.

**Never report a metric alone.** Report it beside the simplest guess, and say which error you chose to care about.
"""
