"""

[[steps]]
claim = "Cosine distance compares directions while ignoring vector length."
source = "week09_embedding/lab.md, 5. Read the table"
source_passage = """
After training, rows can be compared using **cosine distance**, $1-\\cos$: 0 means the same direction, 1 means perpendicular, and 2 means opposite directions. For instance, `[1, 0]` and `[0, 1]` have cosine distance 1. Cosine ignores vector length, so it answers a different question from Euclidean distance.
"""
text = """
