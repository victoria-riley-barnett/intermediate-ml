[[steps]]
claim = "Each occurrence of a residue gets the same row, whatever its context."
see = ["11-attention"]
source = "week09_embedding/lecture.md, What the table cannot see"
source_passage = """
Every L retrieves the same row, whether it occurs near one set of residues or another. The averaged context can change the centre prediction, but it does not make the original lookup row for L context-dependent. Averaging also forgets neighbour order: `A L V D K G` and `G K D V L A` have the same mean. Long-range residues outside the window are absent altogether.

"""
