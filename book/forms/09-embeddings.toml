[[steps]]
claim = "Averaging makes one context vector and forgets neighbour order."
see = ["10-whole-sequences"]
source = "week09_embedding/lab.md, 3. A table and a head"
source_passage = """
`nn.Embedding(20, 8)` is a lookup table and nothing more: twenty rows of eight numbers, a hundred and sixty numbers in all, initialised as noise. The forward pass takes ids of shape `(B, 6)`, returns rows of shape `(B, 6, 8)`, and averages over the six neighbours to give a context vector of shape `(B, 8)`. Averaging is what collapses six rows into one while keeping the width at eight, and it also makes the model blind to the order of the neighbours — a bag of context, not a sequence.
"""
text = """
`nn.Embedding(20, 8)` is a lookup table and nothing more: twenty rows of eight numbers, a hundred and sixty numbers in all, initialised as noise. The forward pass takes ids of shape `(B, 6)`, returns rows of shape `(B, 6, 8)`, and averages over the six neighbours to give a context vector of shape `(B, 8)`. Averaging is what collapses six rows into one while keeping the width at eight, and it also makes the model blind to the order of the neighbours — a bag of context, not a sequence.
"""

[[steps]]
claim = "A linear head turns the context into scores and a loss."
see = ["06-multiclass"]
source = "week09_embedding/lecture.md, From six neighbours to one prediction"
source_passage = """
The six IDs become six vectors of eight numbers. The model averages those vectors into a single context vector. A linear head turns that summary into 20 scores, one for each candidate centre residue. Softmax turns the scores into probabilities, and a loss measures how much probability was assigned to the recorded centre. Each part answers a different question: what numbers represent the neighbours, what centre does their summary support, and how well does that prediction agree with the target?
"""
text = """
