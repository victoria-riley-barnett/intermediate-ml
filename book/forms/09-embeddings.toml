[[steps]]
claim = "An embedding gives each residue type an adjustable vector."
source = "week09_embedding/lecture.md, introduction"
source_passage = """
An **embedding** gives each residue type a vector: an ordered list of numbers used by the model. The same vector is looked up wherever that residue appears. Training changes those vectors in response to the prediction task.
"""
text = """
An **embedding** gives each residue type a vector: an ordered list of numbers used by the model. The same vector is looked up wherever that residue appears. Training changes those vectors in response to the prediction task.
"""

[[steps]]
claim = "A residue ID is an address into the embedding table."
see = ["08-fixed-size-inputs"]
source = "week09_embedding/lecture.md, A lookup table with learnable rows"
source_passage = """
The ID is an address, not a measurement: ID 9 is not chemically larger than ID 7. Looking up L returns the same eight numbers as multiplying L's one-hot row by $E$. Lookup skips the multiplication by all the zeroes.
"""
text = """
The ID is an address, not a measurement: ID 9 is not chemically larger than ID 7. Looking up L returns the same eight numbers as multiplying L's one-hot row by $E$. Lookup skips the multiplication by all the zeroes.
"""
figure = "embedding"

[[steps]]
claim = "The target residue is left out while its six neighbours supply the input."
source = "week09_embedding/lecture.md, A protein supplies its own missing-letter task"
source_passage = """
Each eligible position is one training example: six neighbours are the input, and the residue in the middle is the target. The following short sequence is an **invented illustration**, not a sequence claimed to have been measured:

The target `I` comes from the centre of `A L V I D K G`; hiding it creates the input `A L V D K G`. With the fixed alphabet, the input IDs are `[0, 9, 17, 2, 8, 5]` and the target ID is `7`. The target is retained for the loss, but its position is not passed into the model as an input.
"""
text = """
